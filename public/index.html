<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Free Ollama API Gateway</title>
<meta name="description" content="Managed proxy gateway over an authorized Ollama node pool with consent gating, discovery, and admin dashboard">
<meta property="og:title" content="Free Ollama API Gateway">
<meta property="og:description" content="Managed proxy gateway over an authorized Ollama node pool with consent gating, discovery, and admin dashboard">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Recharts UMD: unpkg@2.12.7 отдавал 404 (нет UMD-сборки по этому пути) → window.Recharts был undefined.
     Основной CDN — jsdelivr; при сбое грузим cdnjs синхронно через document.write (fallback). -->
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
<script>window.Recharts || document.write('<script src="https:\/\/cdnjs.cloudflare.com\/ajax\/libs\/recharts\/2.15.0\/Recharts.min.js"><\/script>');</script>
</head>
<body>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toasts"></div>

<!-- ===== Login Screen ===== -->
<div id="login-screen">
  <div class="login-box">
    <span class="logo">🦙</span>
    <h1>FOA Gateway</h1>
    <p class="subtitle">Панель администрирования</p>
    <input type="password" id="login-token" placeholder="Admin / Auditor Token (например: foa-admin-secret)" value="foa-admin-secret" autocomplete="off">
    <button class="btn-login" onclick="doLogin()">Войти в панель</button>
    <div style="margin-top: 10px; font-size: 12px; color: var(--text3);">Демо-токен: <span style="color:var(--accent2); font-family:var(--mono);">foa-admin-secret</span></div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ===== App Layout ===== -->
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="icon">🦙</span> FOA Gateway</div>
    <nav class="sidebar-nav">
      <div class="section-label">Обзор</div>
      <a href="#dashboard" data-page="dashboard"><span class="icon">📊</span> Dashboard</a>
      <a href="#monitor" data-page="monitor"><span class="icon">📈</span> Monitor</a>
      <div class="section-label">Управление</div>
      <a href="#nodes" data-page="nodes"><span class="icon">🖥️</span> Узлы</a>
      <a href="#blacklist" data-page="blacklist"><span class="icon">🚫</span> Чёрный список</a>
      <a href="#discovery" data-page="discovery"><span class="icon">🔍</span> Discovery</a>
      <a href="#keys" data-page="keys"><span class="icon">🔑</span> API-ключи</a>
      <div class="section-label">Система</div>
      <a href="#audit" data-page="audit"><span class="icon">📋</span> Аудит</a>
      <a href="#config" data-page="config"><span class="icon">⚙️</span> Конфигурация</a>
      <a href="#apidocs" data-page="apidocs"><span class="icon">📖</span> API Docs</a>
      <a href="#help" data-page="help"><span class="icon">❓</span> Помощь</a>
    </nav>
    <div class="sidebar-footer">
      <span id="sidebar-version"></span>
      <button onclick="doLogout()">Выйти</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ===== Modals Container ===== -->
<div id="modals"></div>

<!-- ===== Styles ===== -->
<link rel="stylesheet" href="/css/dashboard.css">

<!-- ===== JS Modules (классические скрипты, общий scope) ===== -->
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/router.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/monitor.js"></script>
<script src="/js/nodes.js"></script>
<script src="/js/nodechat.js"></script>
<script src="/js/blacklist.js"></script>
<script src="/js/discovery.js"></script>
<script src="/js/keys.js"></script>
<script src="/js/audit.js"></script>
<script src="/js/help.js"></script>
<script src="/js/config.js"></script>
<script src="/js/apidocs.js"></script>
</body>
</html>
