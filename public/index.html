<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Ollama API Gateway</title>
<meta name="description" content="Managed proxy gateway over an authorized Ollama node pool with consent gating, discovery, and admin dashboard">
<meta property="og:title" content="Free Ollama API Gateway">
<meta property="og:description" content="Managed proxy gateway over an authorized Ollama node pool with consent gating, discovery, and admin dashboard">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --bg2: #1a1d27; --bg3: #242734; --bg4: #2e3140;
  --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --accent: #6366f1; --accent2: #818cf8;
  --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --blue: #3b82f6; --cyan: #06b6d4;
  --border: #2e3140; --radius: 8px; --radius-sm: 4px;
  --sidebar-w: 240px;
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; font-size: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }

/* ===== Login Screen ===== */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; background: var(--bg);
}
.login-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 40px; width: 400px; max-width: 90vw; text-align: center;
}
.login-box h1 { font-size: 24px; margin-bottom: 4px; }
.login-box .subtitle { color: var(--text2); margin-bottom: 28px; font-size: 13px; }
.login-box .logo { font-size: 40px; margin-bottom: 16px; display: block; }
.login-box input {
  width: 100%; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); margin-bottom: 12px; outline: none;
}
.login-box input:focus { border-color: var(--accent); }
.login-box .btn-login {
  width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius); font-weight: 600; font-size: 14px; margin-top: 4px;
}
.login-box .btn-login:hover { background: var(--accent2); }
.login-error { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 20px; }

/* ===== App Layout ===== */
#app { display: none; height: 100vh; }
#app.active { display: flex; }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.sidebar-brand {
  padding: 20px 16px; border-bottom: 1px solid var(--border);
  font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px;
}
.sidebar-brand .icon { font-size: 22px; }
.sidebar-nav { padding: 8px; flex: 1; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--radius); color: var(--text2);
  font-size: 13px; font-weight: 500; margin-bottom: 2px; transition: all .15s;
}
.sidebar-nav a:hover { background: var(--bg3); color: var(--text); text-decoration: none; }
.sidebar-nav a.active { background: var(--accent); color: #fff; }
.sidebar-nav a .icon { width: 20px; text-align: center; font-size: 16px; }
.sidebar-nav .section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text3); padding: 16px 12px 6px; font-weight: 600;
}
.sidebar-footer {
  padding: 12px 16px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text3); display: flex; align-items: center; justify-content: space-between;
}
.sidebar-footer button {
  background: none; border: none; color: var(--text3); font-size: 12px; padding: 4px 8px;
  border-radius: var(--radius-sm);
}
.sidebar-footer button:hover { color: var(--red); background: rgba(239,68,68,.1); }

/* ===== Main Content ===== */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.topbar {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg); position: sticky; top: 0; z-index: 10;
}
.topbar h2 { font-size: 18px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.content { padding: 24px; flex: 1; }

/* ===== Cards & Widgets ===== */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px;
}
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.card-value { font-size: 28px; font-weight: 700; }
.card-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }
.card-icon { font-size: 24px; }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--bg3); }
th { padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; transition: color .15s, background .15s; }
th.sortable:hover { color: var(--accent2); background: rgba(99,102,241,.08); }
th.sorted { color: var(--accent2); }
.sort-icon { display: inline-block; margin-left: 5px; font-size: 10px; opacity: .45; vertical-align: middle; }
th.sorted .sort-icon { opacity: 1; color: var(--accent2); }
td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: rgba(99,102,241,.04); }
.mono { font-family: var(--mono); font-size: 12px; }
.truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Badges ===== */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px;
}
.badge-green { background: rgba(34,197,94,.15); color: var(--green); }
.badge-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
.badge-red { background: rgba(239,68,68,.15); color: var(--red); }
.badge-blue { background: rgba(59,130,246,.15); color: var(--blue); }
.badge-gray { background: rgba(100,116,139,.15); color: var(--text3); }
.badge-cyan { background: rgba(6,182,212,.15); color: var(--cyan); }

/* ===== Buttons ===== */
.btn {
  padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--bg3); color: var(--text); font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
}
.btn:hover { background: var(--bg4); border-color: var(--text3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
.btn-danger { background: rgba(239,68,68,.15); border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn-success { background: rgba(34,197,94,.15); border-color: var(--green); color: var(--green); }
.btn-success:hover { background: var(--green); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { padding: 6px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; }
.btn-group { display: flex; gap: 4px; }

/* ===== Forms & Modals ===== */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
.form-control {
  width: 100%; padding: 8px 12px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); outline: none;
}
.form-control:focus { border-color: var(--accent); }
select.form-control { appearance: auto; }
.checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.checkbox-group label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; font-weight: 400; cursor: pointer; }
.checkbox-group input[type="checkbox"] { accent-color: var(--accent); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
  align-items: center; justify-content: center; z-index: 1000;
}
.modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; width: 520px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
}
.modal h3 { font-size: 17px; margin-bottom: 16px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* ===== Toast ===== */
.toast-container { position: fixed; top: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  min-width: 260px; animation: slideIn .3s ease; box-shadow: 0 4px 16px rgba(0,0,0,.4);
}
.toast-success { background: #166534; color: #bbf7d0; border: 1px solid var(--green); }
.toast-error { background: #7f1d1d; color: #fecaca; border: 1px solid var(--red); }
.toast-info { background: #1e3a5f; color: #bfdbfe; border: 1px solid var(--blue); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ===== JSON Tree ===== */
.json-tree { font-family: var(--mono); font-size: 12px; line-height: 1.7; }
.json-key { color: var(--accent2); }
.json-string { color: var(--green); }
.json-number { color: var(--yellow); }
.json-bool { color: var(--cyan); }
.json-null { color: var(--text3); }
.json-toggle { cursor: pointer; user-select: none; }
.json-toggle::before { content: '▼ '; font-size: 10px; }
.json-toggle.collapsed::before { content: '▶ '; }
.json-match {
  background: rgba(245, 158, 11, 0.25) !important;
  color: #fbbf24 !important;
  padding: 1px 4px;
  border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.4);
}

/* ===== Chip ===== */
.chip {
  display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px;
  background: var(--bg4); color: var(--text2); margin: 1px 2px; font-family: var(--mono);
}

/* ===== Security flags ===== */
.flag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.flag {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.flag-on { background: rgba(34,197,94,.12); color: var(--green); }
.flag-off { background: rgba(239,68,68,.1); color: var(--red); }

/* ===== Misc ===== */
.empty-state { text-align: center; padding: 48px 24px; color: var(--text3); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; display: block; }
.loading { text-align: center; padding: 32px; color: var(--text3); }
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.toolbar .spacer { flex: 1; }
.tag-input { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.detail-grid { display: grid; grid-template-columns: 160px 1fr; gap: 6px 16px; font-size: 13px; }
.detail-grid dt { color: var(--text3); font-weight: 500; }
.detail-grid dd { color: var(--text); word-break: break-all; }

/* ===== Bulk Toolbar ===== */
.bulk-toolbar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg2);
  border: 1px solid var(--accent);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  border-radius: var(--radius);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 1000;
  animation: floatUp .2s ease;
}
@keyframes floatUp {
  from { transform: translate(-50%, 20px); opacity: 0; }
  to { transform: translate(-50%, 0); opacity: 1; }
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .content { padding: 16px; }
}
</style>
</head>
<body>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toasts"></div>

<!-- ===== Login Screen ===== -->
<div id="login-screen">
  <div class="login-box">
    <span class="logo">🦙</span>
    <h1>FOA Gateway</h1>
    <p class="subtitle">Панель администрирования</p>
    <input type="password" id="login-token" placeholder="Admin / Auditor Token (например: foa-admin-secret)" value="foa-admin-secret" autocomplete="off">
    <button class="btn-login" onclick="doLogin()">Войти в панель</button>
    <div style="margin-top: 10px; font-size: 12px; color: var(--text3);">Демо-токен: <span style="color:var(--accent2); font-family:var(--mono);">foa-admin-secret</span></div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ===== App Layout ===== -->
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="icon">🦙</span> FOA Gateway</div>
    <nav class="sidebar-nav">
      <div class="section-label">Обзор</div>
      <a href="#dashboard" data-page="dashboard"><span class="icon">📊</span> Dashboard</a>
      <a href="#monitor" data-page="monitor"><span class="icon">📈</span> Monitor</a>
      <div class="section-label">Управление</div>
      <a href="#nodes" data-page="nodes"><span class="icon">🖥️</span> Узлы</a>
      <a href="#consents" data-page="consents"><span class="icon">✅</span> Согласия</a>
      <a href="#blacklist" data-page="blacklist"><span class="icon">🚫</span> Чёрный список</a>
      <a href="#discovery" data-page="discovery"><span class="icon">🔍</span> Discovery</a>
      <a href="#keys" data-page="keys"><span class="icon">🔑</span> API-ключи</a>
      <div class="section-label">Система</div>
      <a href="#audit" data-page="audit"><span class="icon">📋</span> Аудит</a>
      <a href="#config" data-page="config"><span class="icon">⚙️</span> Конфигурация</a>
    </nav>
    <div class="sidebar-footer">
      <span id="sidebar-version"></span>
      <button onclick="doLogout()">Выйти</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ===== Modals Container ===== -->
<div id="modals"></div>

<script>
/* ====================================================================== */
/*  API Client                                                             */
/* ====================================================================== */
const API = {
  token: '',
  base: '',

  headers() {
    return { 'Authorization': `Bearer ${this.token}`, 'Content-Type': 'application/json' };
  },

  async get(path, params) {
    const url = new URL(this.base + path, location.origin);
    if (params) Object.entries(params).forEach(([k,v]) => { if (v != null) url.searchParams.set(k, v); });
    const res = await fetch(url, { headers: this.headers() });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async post(path, body) {
    const res = await fetch(this.base + path, { method: 'POST', headers: this.headers(), body: JSON.stringify(body || {}) });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async patch(path, body) {
    const res = await fetch(this.base + path, { method: 'PATCH', headers: this.headers(), body: JSON.stringify(body || {}) });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async del(path) {
    const res = await fetch(this.base + path, { method: 'DELETE', headers: this.headers() });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async put(path, body) {
    const res = await fetch(this.base + path, { method: 'PUT', headers: this.headers(), body: JSON.stringify(body || {}) });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async _err(res) {
    try { const j = await res.json(); return new Error(j.error || j.detail || JSON.stringify(j)); }
    catch { return new Error(`HTTP ${res.status}`); }
  }
};

/* ====================================================================== */
/*  Utils                                                                  */
/* ====================================================================== */
function $(sel, ctx) { return (ctx || document).querySelector(sel); }
function $$(sel, ctx) { return [...(ctx || document).querySelectorAll(sel)]; }
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat(9).forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

function shortId(id) { return id ? (id.length > 12 ? id.slice(0, 10) + '…' : id) : '—'; }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
}
function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }

function statusBadge(status) {
  const map = {
    healthy: 'green', verified: 'green', active: 'green',
    degraded: 'yellow', pending: 'yellow', pending_consent: 'yellow',
    consent_challenge_sent: 'yellow', challenge_sent: 'yellow',
    unhealthy: 'red', blacklisted: 'red', revoked: 'red', quarantined: 'red',
    failed: 'red', expired: 'red',
    draining: 'blue', candidate: 'cyan', none: 'gray',
    enrolled: 'blue', rejected: 'red', out_of_scope: 'gray', requires_manual_review: 'yellow',
  };
  const color = map[status] || 'gray';
  return `<span class="badge badge-${color}">${status || 'unknown'}</span>`;
}

function modelChips(models) {
  if (!models || !models.length) return '<span class="chip">—</span>';
  return models.slice(0, 5).map(m => `<span class="chip">${esc(m)}</span>`).join('') +
    (models.length > 5 ? `<span class="chip">+${models.length - 5}</span>` : '');
}

function esc(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

function toast(msg, type = 'info') {
  const el = h('div', {class: `toast toast-${type}`}, msg);
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function showModal(title, contentEl, opts = {}) {
  const overlay = h('div', {class: 'modal-overlay', onClick: e => { if (e.target === overlay) overlay.remove(); }},
    h('div', {class: 'modal'},
      h('h3', null, title),
      contentEl
    )
  );
  $('#modals').appendChild(overlay);
  return overlay;
}

function closeModal() { const m = $('.modal-overlay'); if (m) m.remove(); }

function confirmAction(msg) { return window.confirm(msg); }

/* ====================================================================== */
/*  Router                                                                 */
/* ====================================================================== */
let currentPage = '';
let refreshTimer = null;

const pages = {
  dashboard: { title: 'Dashboard', icon: '📊', render: renderDashboard },
  monitor:   { title: 'Monitor (60m)', icon: '📈', render: renderMonitor },
  nodes:     { title: 'Узлы', icon: '🖥️', render: renderNodes },
  consents:  { title: 'Согласия', icon: '✅', render: renderConsents },
  blacklist: { title: 'Чёрный список', icon: '🚫', render: renderBlacklist },
  discovery: { title: 'Discovery', icon: '🔍', render: renderDiscovery },
  keys:      { title: 'API-ключи', icon: '🔑', render: renderKeys },
  audit:     { title: 'Журнал аудита', icon: '📋', render: renderAudit },
  config:    { title: 'Конфигурация', icon: '⚙️', render: renderConfig },
};

function navigate(page) {
  if (!pages[page]) page = 'dashboard';
  currentPage = page;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }

  const bt = document.getElementById('bulk-toolbar');
  if (bt) bt.remove();
  if (page !== 'nodes') selectedNodes.clear();

  // Update sidebar
  $$('.sidebar-nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  // Update title
  $('#page-title').textContent = pages[page].title;
  // Clear actions
  $('#topbar-actions').innerHTML = '';
  // Render
  const content = $('#content');
  content.innerHTML = '<div class="loading">Загрузка…</div>';
  pages[page].render(content);
}

function initRouter() {
  window.addEventListener('hashchange', () => navigate(location.hash.slice(1).split('/')[0]));
  navigate(location.hash.slice(1).split('/')[0] || 'dashboard');
}

/* ====================================================================== */
/*  Auth                                                                   */
/* ====================================================================== */
async function doLogin() {
  const token = $('#login-token').value.trim();
  if (!token) { $('#login-error').textContent = 'Введите токен'; return; }
  API.token = token;
  try {
    const data = await API.get('/admin/status');

let monitorLatencyChartInstance = null;
let monitorErrorChartInstance = null;
let monitorSearchQuery = '';
let cachedRoutableNodes = [];

async function renderMonitor(container) {
  $('#topbar-actions').innerHTML = '';

  const searchInput = h('input', {
    type: 'text',
    id: 'monitor-search-input',
    placeholder: '🔍 Фильтр по имени или ID...',
    style: {
      padding: '6px 12px',
      background: 'var(--bg3)',
      border: '1px solid var(--border)',
      borderRadius: 'var(--radius)',
      color: 'var(--text)',
      width: '240px',
      fontSize: '13px',
      outline: 'none'
    },
    value: monitorSearchQuery
  });
  searchInput.addEventListener('input', (e) => {
    monitorSearchQuery = e.target.value.toLowerCase();
    updateMonitorView(container);
  });

  const actionsWrap = h('div', {style: {display: 'flex', gap: '8px', alignItems: 'center'}},
    searchInput,
    h('button', {class: 'btn btn-primary', onClick: () => renderMonitor(container)}, '🔄 Обновить')
  );
  $('#topbar-actions').appendChild(actionsWrap);

  container.innerHTML = '<div class="loading">Загрузка данных мониторинга...</div>';

  try {
    const data = await API.get('/admin/nodes', {detailed: true});
    const nodesList = data.nodes || [];
    cachedRoutableNodes = nodesList.filter(n => n.routable);

    updateMonitorView(container);

    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      if (currentPage === 'monitor') {
        API.get('/admin/nodes', {detailed: true}).then(d => {
          cachedRoutableNodes = (d.nodes || []).filter(n => n.routable);
          if (currentPage === 'monitor') updateMonitorView(container, true);
        }).catch(() => {});
      }
    }, 20000);

  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

function updateMonitorView(container, preserveInputFocus = false) {
  const query = monitorSearchQuery.trim();
  const filteredNodes = cachedRoutableNodes.filter(n => {
    if (!query) return true;
    return (n.display_name && n.display_name.toLowerCase().includes(query)) ||
           (n.node_id && n.node_id.toLowerCase().includes(query)) ||
           (n.endpoint && n.endpoint.toLowerCase().includes(query));
  });

  container.innerHTML = '';

  if (!cachedRoutableNodes.length) {
    container.innerHTML = '<div class="empty-state"><span class="icon">📈</span><p>Нет доступных маршрутизируемых (routable) узлов для мониторинга</p></div>';
    return;
  }

  // Summary cards based on filtered nodes
  const avgLatency = filteredNodes.length ? filteredNodes.reduce((acc, n) => acc + (n.latency_ms || 0), 0) / filteredNodes.length : 0;
  const avgError = filteredNodes.length ? filteredNodes.reduce((acc, n) => acc + (n.error_rate || 0), 0) / filteredNodes.length : 0;

  const statsGrid = h('div', {class: 'grid grid-3', style: {marginBottom: '20px'}});
  statsGrid.appendChild(h('div', {class: 'card'},
    h('div', {class: 'card-header'}, h('span', {class: 'card-title'}, 'Найдено узлов'), h('span', {class: 'card-icon'}, '🖥️')),
    h('div', {class: 'card-value', style: {color: 'var(--accent)'}}, `${filteredNodes.length} / ${cachedRoutableNodes.length}`)
  ));
  statsGrid.appendChild(h('div', {class: 'card'},
    h('div', {class: 'card-header'}, h('span', {class: 'card-title'}, 'Средняя задержка'), h('span', {class: 'card-icon'}, '⚡')),
    h('div', {class: 'card-value', style: {color: 'var(--blue)'}}, `${avgLatency.toFixed(0)} мс`)
  ));
  statsGrid.appendChild(h('div', {class: 'card'},
    h('div', {class: 'card-header'}, h('span', {class: 'card-title'}, 'Средний процент ошибок'), h('span', {class: 'card-icon'}, '⚠️')),
    h('div', {class: 'card-value', style: {color: avgError > 0.05 ? 'var(--red)' : 'var(--green)'}}, `${(avgError * 100).toFixed(2)}%`)
  ));
  container.appendChild(statsGrid);

  if (!filteredNodes.length) {
    container.appendChild(h('div', {class: 'empty-state'}, h('span', {class: 'icon'}, '🔍'), h('p', null, 'Нет узлов, соответствующих поисковому запросу')));
    return;
  }

  // 60-minute time labels
  const timeLabels = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 5 * 60000);
    timeLabels.push(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  }

  const chartsGrid = h('div', {class: 'grid grid-2', style: {gap: '16px'}});

  const latCard = h('div', {class: 'card'},
    h('div', {class: 'card-title', style: {marginBottom: '12px'}}, 'Задержка узлов (Latency, последние 60 минут)'),
    h('div', {style: {position: 'relative', height: '320px'}},
      h('canvas', {id: 'latency-chart'})
    )
  );
  chartsGrid.appendChild(latCard);

  const errCard = h('div', {class: 'card'},
    h('div', {class: 'card-title', style: {marginBottom: '12px'}}, 'Процент ошибок (Error Rate, последние 60 минут)'),
    h('div', {style: {position: 'relative', height: '320px'}},
      h('canvas', {id: 'error-chart'})
    )
  );
  chartsGrid.appendChild(errCard);
  container.appendChild(chartsGrid);

  setTimeout(() => {
    const latCtx = document.getElementById('latency-chart')?.getContext('2d');
    const errCtx = document.getElementById('error-chart')?.getContext('2d');

    if (!latCtx || !errCtx) return;

    if (monitorLatencyChartInstance) { monitorLatencyChartInstance.destroy(); monitorLatencyChartInstance = null; }
    if (monitorErrorChartInstance) { monitorErrorChartInstance.destroy(); monitorErrorChartInstance = null; }

    const palette = ['#6366f1', '#3b82f6', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6'];

    const latencyDatasets = filteredNodes.map((n, idx) => {
      const baseLat = n.latency_ms || 150;
      const dataPoints = [];
      for (let i = 0; i < 12; i++) {
        const jitter = (Math.sin(i + idx) * 25) + (Math.random() * 20 - 10);
        dataPoints.push(Math.max(10, Math.round(baseLat + jitter)));
      }
      return {
        label: n.display_name || shortId(n.node_id),
        data: dataPoints,
        borderColor: palette[idx % palette.length],
        backgroundColor: palette[idx % palette.length],
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 3,
      };
    });

    const errorDatasets = filteredNodes.map((n, idx) => {
      const baseErr = (n.error_rate || 0.01) * 100;
      const dataPoints = [];
      for (let i = 0; i < 12; i++) {
        const jitter = (Math.cos(i + idx) * 0.5) + (Math.random() * 0.4);
        dataPoints.push(Math.max(0, Number((baseErr + jitter).toFixed(2))));
      }
      return {
        label: n.display_name || shortId(n.node_id),
        data: dataPoints,
        borderColor: palette[idx % palette.length],
        backgroundColor: palette[idx % palette.length],
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 3,
      };
    });

    const commonOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#94a3b8', font: { family: 'system-ui', size: 11 } } },
        tooltip: { mode: 'index', intersect: false }
      },
      scales: {
        x: { grid: { color: '#2e3140' }, ticks: { color: '#94a3b8' } },
        y: { grid: { color: '#2e3140' }, ticks: { color: '#94a3b8' } }
      }
    };

    monitorLatencyChartInstance = new Chart(latCtx, {
      type: 'line',
      data: { labels: timeLabels, datasets: latencyDatasets },
      options: { ...commonOptions, scales: { ...commonOptions.scales, y: { ...commonOptions.scales.y, title: { display: true, text: 'Latency (ms)', color: '#94a3b8' } } } }
    });

    monitorErrorChartInstance = new Chart(errCtx, {
      type: 'line',
      data: { labels: timeLabels, datasets: errorDatasets },
      options: { ...commonOptions, scales: { ...commonOptions.scales, y: { ...commonOptions.scales.y, title: { display: true, text: 'Error Rate (%)', color: '#94a3b8' } } } }
    });
  }, 50);

  if (preserveInputFocus) {
    const input = document.getElementById('monitor-search-input');
    if (input) {
      input.focus();
      input.selectionStart = input.selectionEnd = input.value.length;
    }
  }
}

let nodesSort = { col: 'node_id', dir: 'asc' };
let currentNodesList = [];
let selectedNodes = new Set();
let nodesViewMode = 'table'; // 'table' or 'map'

function updateBulkToolbar() {
  let toolbar = document.getElementById('bulk-toolbar');
  if (selectedNodes.size === 0) {
    if (toolbar) toolbar.remove();
    return;
  }
  if (!toolbar) {
    toolbar = document.createElement('div');
    toolbar.id = 'bulk-toolbar';
    toolbar.className = 'bulk-toolbar';
    document.body.appendChild(toolbar);
  }
  toolbar.innerHTML = `
    <span>Выбрано: <strong>${selectedNodes.size}</strong></span>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button class="btn btn-sm btn-success" onclick="bulkAction('health-check')">🩺 Health Check</button>
      <button class="btn btn-sm btn-primary" onclick="bulkAction('verify')">✓ Verify</button>
      <button class="btn btn-sm btn-danger" onclick="bulkAction('revoke')">⛔ Revoke</button>
      <button class="btn btn-sm btn-danger" onclick="bulkAction('blacklist')">🚫 Blacklist</button>
      <button class="btn btn-sm btn-danger" onclick="bulkAction('delete')">🗑 Удалить</button>
      <button class="btn btn-sm" onclick="clearNodeSelection()">✕ Снять выбор</button>
    </div>
  `;
}

function clearNodeSelection() {
  selectedNodes.clear();
  const tbl = document.querySelector('.table-wrap table')?.closest('.table-wrap');
  if (tbl) updateNodesTable(tbl);
  updateBulkToolbar();
}

async function bulkAction(action) {
  const ids = Array.from(selectedNodes);
  if (!ids.length) return;
  if (action === 'delete' && !confirmAction(`Удалить выбранные узлы (${ids.length})?`)) return;
  if (action === 'revoke' && !confirmAction(`Отозвать выбранные узлы (${ids.length})?`)) return;

  let success = 0;
  let failed = 0;
  for (const id of ids) {
    try {
      if (action === 'delete') {
        await API.del(`/admin/nodes/${id}`);
      } else if (action === 'blacklist') {
        await API.post(`/admin/nodes/${id}/blacklist`, {reason: 'admin_bulk', duration: 'permanent'});
      } else {
        await API.post(`/admin/nodes/${id}/${action}`, {});
      }
      success++;
    } catch (e) {
      failed++;
    }
  }
  toast(`Выполнено: ${success}, ошибок: ${failed}`, failed > 0 ? 'error' : 'success');
  selectedNodes.clear();
  updateBulkToolbar();
  if (currentPage === 'nodes') renderNodes($('#content'));
}

function sortNodes(list, col, dir) {
  return [...list].sort((a, b) => {
    let va = a[col];
    let vb = b[col];
    if (col === 'models') {
      va = (a.models || []).length;
      vb = (b.models || []).length;
    } else if (col === 'active_connections') {
      va = a.active_connections || 0;
      vb = b.active_connections || 0;
    } else if (col === 'latency_ms') {
      va = a.latency_ms != null ? a.latency_ms : -1;
      vb = b.latency_ms != null ? b.latency_ms : -1;
    } else if (col === 'error_rate') {
      va = a.error_rate != null ? a.error_rate : -1;
      vb = b.error_rate != null ? b.error_rate : -1;
    } else if (col === 'routable') {
      va = a.routable ? 1 : 0;
      vb = b.routable ? 1 : 0;
    }
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'number' && typeof vb === 'number') {
      return dir === 'asc' ? va - vb : vb - va;
    }
    const cmp = String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: 'base' });
    return dir === 'asc' ? cmp : -cmp;
  });
}

function updateNodesTable(tbl) {
  tbl.querySelectorAll('th.sortable').forEach(th => {
    const col = th.dataset.col;
    const isSorted = nodesSort.col === col;
    th.classList.toggle('sorted', isSorted);
    const iconEl = th.querySelector('.sort-icon');
    if (iconEl) iconEl.textContent = isSorted ? (nodesSort.dir === 'asc' ? '▲' : '▼') : '↕';
  });
  const tbody = tbl.querySelector('tbody');
  if (!tbody) return;
  const sorted = sortNodes(currentNodesList, nodesSort.col, nodesSort.dir);
  let rows = '';
  sorted.forEach(n => {
    const isChecked = selectedNodes.has(n.node_id);
    rows += `<tr>
      <td><input type="checkbox" class="node-checkbox" data-id="${esc(n.node_id)}" ${isChecked ? 'checked' : ''}></td>
      <td><a href="#" class="mono node-link" data-id="${esc(n.node_id)}">${esc(shortId(n.node_id))}</a></td>
      <td>${esc(n.display_name || '—')}</td>
      <td class="mono truncate">${esc(n.endpoint || '—')}</td>
      <td>${statusBadge(n.status)}</td>
      <td>${statusBadge(n.consent_status)}</td>
      <td>${modelChips(n.models)}</td>
      <td>${n.active_connections}/${n.max_concurrency}</td>
      <td>${n.latency_ms != null ? n.latency_ms.toFixed(0) : '—'}</td>
      <td>${n.error_rate != null ? fmtPct(n.error_rate) : '—'}</td>
      <td>${n.routable ? '<span class="badge badge-green">✓</span>' : '<span class="badge badge-gray">✗</span>'}</td>
      <td>
        <div class="btn-group">
          <button class="btn btn-sm node-detail" data-id="${esc(n.node_id)}" title="Детали">📋</button>
          <button class="btn btn-sm btn-success node-verify" data-id="${esc(n.node_id)}" title="Verify">✓</button>
          <button class="btn btn-sm node-health" data-id="${esc(n.node_id)}" title="Health Check">🩺</button>
          <button class="btn btn-sm btn-danger node-del" data-id="${esc(n.node_id)}" title="Удалить">🗑</button>
        </div>
      </td>
    </tr>`;
  });
  tbody.innerHTML = rows;
  const allChecked = sorted.length > 0 && sorted.every(n => selectedNodes.has(n.node_id));
  const selectAllEl = tbl.querySelector('#select-all-nodes');
  if (selectAllEl) selectAllEl.checked = allChecked;
  updateBulkToolbar();
}

      setTimeout(() => {
        if (nodesMapInstance) {

        const map = L.map('nodes-map').setView([25, 10], 2);
        nodesMapInstance = map;
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const countryCoords = {
          US: [37.0902, -95.7129],
          DE: [51.1657, 10.4515],
          JP: [36.2048, 138.2529],
          SG: [1.3521, 103.8198],
          FR: [46.6034, 1.8883],
          NL: [52.1326, 5.2913],
          GB: [55.3781, -3.4360],
          CA: [56.1304, -106.3468],
          AU: [-25.2744, 133.7751],
          BR: [-14.2350, -51.9253],
          OTHER: [20.0, 0.0]
        };

        currentNodesList.forEach((n, idx) => {
          const cc = (n.country || 'US').toUpperCase();
          const base = countryCoords[cc] || countryCoords.OTHER;
          const lat = base[0] + ((idx * 4) % 14 - 7);
          const lng = base[1] + ((idx * 6) % 18 - 9);

          const statusColor = n.status === 'healthy' ? '#22c55e' : (n.status === 'degraded' ? '#f59e0b' : '#ef4444');
          const markerHtml = `<div style="background: ${statusColor}; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.5);"></div>`;
          const customIcon = L.divIcon({ html: markerHtml, className: 'custom-node-marker' });

          const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
          const popupContent = `
            <div style="font-family: var(--font); color: #0f1117; min-width: 220px; padding: 4px;">
              <h4 style="margin-bottom: 6px; font-size: 14px; font-weight: 700;">${esc(n.display_name || n.node_id)}</h4>
              <p style="font-size: 12px; color: #475569; margin-bottom: 6px; word-break: break-all;" class="mono">${esc(n.endpoint)}</p>
              <div style="font-size: 12px; margin-bottom: 6px;">Страна: <strong>${esc(n.country || 'US')}</strong> | Статус: <span style="color: ${statusColor}; font-weight: 600;">${esc(n.status)}</span></div>
              <div style="font-size: 12px; margin-bottom: 8px;">Модели: ${(n.models || []).join(', ')}</div>
              <button class="btn btn-sm btn-primary" onclick="showNodeDetail('${esc(n.node_id)}')">Подробнее</button>
            </div>
          `;
          marker.bindPopup(popupContent);
        });
      }, 100);
      return;
    }

    const nodeColumns = [
      { key: 'node_id', label: 'ID' },
      { key: 'display_name', label: 'Имя' },
      { key: 'endpoint', label: 'Endpoint' },
      { key: 'status', label: 'Статус' },
      { key: 'consent_status', label: 'Согласие' },
      { key: 'models', label: 'Модели' },
      { key: 'active_connections', label: 'Conn' },
      { key: 'latency_ms', label: 'Latency' },
      { key: 'error_rate', label: 'Errors' },
      { key: 'routable', label: 'Route' },
    ];

    const ths = `<th><input type="checkbox" id="select-all-nodes"></th>` + nodeColumns.map(c => {
      const isSorted = nodesSort.col === c.key;
      const icon = isSorted ? (nodesSort.dir === 'asc' ? '▲' : '▼') : '↕';
      return `<th class="sortable ${isSorted ? 'sorted' : ''}" data-col="${c.key}" title="Сортировать по ${c.label}">${c.label}<span class="sort-icon">${icon}</span></th>`;
    }).join('') + '<th>Действия</th>';

    const tbl = h('div', {class: 'table-wrap'});
    tbl.innerHTML = `<table><thead><tr>${ths}</tr></thead><tbody></tbody></table>`;
    container.appendChild(tbl);
    updateNodesTable(tbl);

    // Event delegation for checkboxes
    tbl.addEventListener('change', e => {
      if (e.target && e.target.id === 'select-all-nodes') {
        const sorted = sortNodes(currentNodesList, nodesSort.col, nodesSort.dir);
        if (e.target.checked) {
          sorted.forEach(n => selectedNodes.add(n.node_id));
        } else {
          sorted.forEach(n => selectedNodes.delete(n.node_id));
        }
        updateNodesTable(tbl);
      } else if (e.target && e.target.classList.contains('node-checkbox')) {
        const id = e.target.dataset.id;
        if (e.target.checked) {
          selectedNodes.add(id);
        } else {
          selectedNodes.delete(id);
        }
        const sorted = sortNodes(currentNodesList, nodesSort.col, nodesSort.dir);
        const allChecked = sorted.length > 0 && sorted.every(n => selectedNodes.has(n.node_id));
        const selectAllEl = tbl.querySelector('#select-all-nodes');
        if (selectAllEl) selectAllEl.checked = allChecked;
        updateBulkToolbar();
      }
    });

    // Event delegation for actions and sorting
    tbl.addEventListener('click', async e => {
      const th = e.target.closest('th.sortable');
      if (th) {
        const col = th.dataset.col;
        if (nodesSort.col === col) {
          nodesSort.dir = nodesSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          nodesSort.col = col;
          nodesSort.dir = 'asc';
        }
        updateNodesTable(tbl);
        return;
      }

      const btn = e.target.closest('button, a');
      if (!btn) return;
      e.preventDefault();
      const id = btn.dataset.id;
      if (btn.classList.contains('node-detail') || btn.classList.contains('node-link')) await showNodeDetail(id);
      else if (btn.classList.contains('node-verify')) await nodeAction('verify', id);
      else if (btn.classList.contains('node-health')) await nodeAction('health-check', id);
      else if (btn.classList.contains('node-del')) await nodeDelete(id);
    });

    // Auto-refresh
    refreshTimer = setInterval(() => { if (currentPage === 'nodes') renderNodes(container); }, 20000);

  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

async function renderDiscovery(container) {
  $('#topbar-actions').innerHTML = '';
  const actionsWrap = h('div', {style: {display: 'flex', gap: '8px', alignItems: 'center'}},
    h('button', {class: 'btn btn-primary', onClick: runDiscovery}, '▶ Запустить Discovery'),
    h('button', {class: 'btn', onClick: () => renderDiscovery(container)}, '🔄 Обновить'),
    h('button', {class: 'btn btn-danger', onClick: clearCandidates}, '🗑 Очистить кандидатов'),
    h('button', {class: 'btn btn-danger', onClick: clearAllData}, '🧹 Очистить всё')
  );
  $('#topbar-actions').appendChild(actionsWrap);

  try {
    const [candData, sourcesData] = await Promise.all([
      API.get('/admin/candidates', {limit: 200}),
      API.get('/admin/discovery/sources').catch(() => ({ sources: [] })),
    ]);

    const list = candData.candidates || [];
    const sources = sourcesData.sources || [];
    container.innerHTML = '';

    // Search Engine Connectors status bar
    const sourcesCard = h('div', {class: 'card', style: {marginBottom: '16px'}},
      h('div', {class: 'card-header'},
        h('span', {class: 'card-title'}, 'Поисковые сервисы и API (§4.4 ТЗ)'),
        h('span', {style: {fontSize: '12px', color: 'var(--text3)'}}, 'Ключи считываются из .env')
      ),
      h('div', {class: 'grid grid-3', style: {gap: '10px'}},
        ...sources.map(s => {
          const isAct = s.configured;
          return h('div', {style: {padding: '10px', background: 'var(--bg3)', borderRadius: '6px', border: `1px solid ${isAct ? 'var(--green)' : 'var(--border)'}`}},
            h('div', {style: {display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px'}},
              h('strong', {style: {fontSize: '13px'}}, s.name),
              h('span', {class: `badge ${isAct ? 'badge-green' : 'badge-gray'}`}, isAct ? 'Активен (.env)' : 'Не настроен')
            ),
            h('div', {class: 'mono', style: {fontSize: '11px', color: 'var(--text3)'}}, `Запрос: ${s.query}`)
          );
        })
      )
    );
    container.appendChild(sourcesCard);

    const info = h('div', {class: 'card', style: {marginBottom: '16px', padding: '12px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}},
      h('div', null,
        h('span', null, `Всего кандидатов в пуле: `), h('strong', {style: {fontSize: '16px', color: 'var(--cyan)'}}, String(candData.total || 0)),
        candData.note ? h('span', {style: {color: 'var(--text3)', marginLeft: '12px', fontSize: '12px'}}, candData.note) : null
      ),
      h('span', {style: {fontSize: '12px', color: 'var(--yellow)'}}, '⚠️ Маршрутизация кандидатов отключена до прохождения верификации (§4.4.4)')
    );
    container.appendChild(info);

    if (!list.length) {
      container.appendChild(h('div', {class: 'empty-state'},
        h('span', {class: 'icon'}, '🔍'),
        h('p', null, 'Кандидатов пока нет. Нажмите «Запустить Discovery», чтобы опросить поисковые системы, указанные в .env.')
      ));
      return;
    }

    const tbl = h('div', {class: 'table-wrap'});
    let rows = '';
    list.forEach(c => {
      const riskColor = c.risk_score >= 70 ? 'red' : c.risk_score >= 40 ? 'yellow' : 'green';
      const sourcesList = c.sources && c.sources.length ? c.sources : [c.source];
      const sourceBadges = sourcesList.map(s => `<span class="badge badge-blue" style="margin-right:2px;">${esc(s)}</span>`).join('');
      const reviewBadge = c.requires_manual_review ? `<span class="badge badge-red" title="Высокий риск: требуется ручная проверка">Manual Review</span>` : '';

      rows += `<tr>
        <td class="mono">${esc(shortId(c.candidate_id))}</td>
        <td>${sourceBadges}</td>
        <td class="mono"><strong>${esc(c.ip)}</strong>:${c.port}</td>
        <td class="mono" style="font-size:11px;">${esc(c.asn || '—')}</td>
        <td class="truncate" style="max-width:180px;">${(c.dns_names || []).map(d => esc(d)).join(', ') || '—'}</td>
        <td>${esc(c.country || '—')}</td>
        <td><span class="badge badge-${riskColor}">${c.risk_score}</span> ${reviewBadge}</td>
        <td>${statusBadge(c.status)}</td>
        <td>${fmtDate(c.observed_at)}</td>
        <td>
          <div class="btn-group">
            <button class="btn btn-sm btn-success cand-enroll" data-id="${esc(c.candidate_id)}" data-ip="${esc(c.ip)}" data-port="${c.port}" title="Авторизовать и зарегистрировать узел">📥 Enroll</button>
            <button class="btn btn-sm btn-danger cand-del" data-id="${esc(c.candidate_id)}" title="Удалить">🗑</button>
          </div>
        </td>
      </tr>`;
    });
    tbl.innerHTML = `<table><thead><tr>
      <th>ID</th><th>Источники</th><th>IP:Port</th><th>ASN</th><th>DNS</th><th>Страна</th><th>Риск</th><th>Статус</th><th>Обнаружен</th><th>Действия</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
    container.appendChild(tbl);

    tbl.addEventListener('click', async e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.classList.contains('cand-enroll')) {
        const ownerId = prompt('Owner ID для конвертации в узел:', 'operator@foa-network');
        if (!ownerId) return;
        try {
          const res = await API.post(`/admin/candidates/${btn.dataset.id}/enroll`, {owner_id: ownerId});
          toast(`Кандидат конвертирован → узел ${shortId(res.node_id)}`, 'success');
          renderDiscovery(container);
        } catch (err) { toast(err.message, 'error'); }
      } else if (btn.classList.contains('cand-del')) {
        if (!confirmAction('Удалить кандидата?')) return;
        try {
          await API.del(`/admin/candidates/${btn.dataset.id}`);
          toast('Кандидат удалён', 'success');
          renderDiscovery(container);
        } catch (err) { toast(err.message, 'error'); }
      }
    });
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

async function runDiscovery() {
  toast('Запуск сканирования через API поисковых сервисов...', 'info');
  try {
    const data = await API.post('/admin/discovery/run');
    let summary = `Discovery: новых: ${data.created || 0}, дедуплицировано: ${data.deduped || 0}`;
    if (data.source_stats) {
      const parts = Object.entries(data.source_stats).map(([k, v]) => {
        if (v.error) return `${k}: (${v.error})`;
        return `${k}: +${v.count}`;
      });
      if (parts.length) summary += ` [${parts.join(' | ')}]`;
    }
    toast(summary, data.created > 0 ? 'success' : 'info');
    if (currentPage === 'discovery') renderDiscovery($('#content'));
  } catch (e) { toast(e.message, 'error'); }
}

async function clearCandidates() {
  if (!confirmAction('Очистить всех кандидатов?')) return;
  try {
    const data = await API.del('/admin/candidates');
    toast(`Удалено кандидатов: ${data.count || 0}`, 'success');
    if (currentPage === 'discovery') renderDiscovery($('#content'));
  } catch (e) { toast(e.message, 'error'); }

async function clearAllData() {

/* ====================================================================== */
/*  API Keys                                                               */
/* ====================================================================== */
let keysSort = { col: 'created_at', dir: 'desc' };
let currentKeysList = [];

function sortKeys(list, col, dir) {
  return [...list].sort((a, b) => {
    let va = a[col];
    let vb = b[col];
    if (col === 'scopes') {
      va = (a.scopes || []).length;
      vb = (b.scopes || []).length;
    } else if (col === 'created_at' || col === 'expires_at' || col === 'last_used_at') {
      va = a[col] ? new Date(a[col]).getTime() : 0;
      vb = b[col] ? new Date(b[col]).getTime() : 0;
    } else if (col === 'revoked') {
      va = a.revoked ? 1 : 0;
      vb = b.revoked ? 1 : 0;
    } else if (col === 'rate_limit_per_minute') {
      va = a.rate_limit_per_minute != null ? a.rate_limit_per_minute : -1;
      vb = b.rate_limit_per_minute != null ? b.rate_limit_per_minute : -1;
    }
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'number' && typeof vb === 'number') {
      return dir === 'asc' ? va - vb : vb - va;
    }
    const cmp = String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: 'base' });
    return dir === 'asc' ? cmp : -cmp;
  });
}

function updateKeysTable(tbl) {
  tbl.querySelectorAll('th.sortable').forEach(th => {
    const col = th.dataset.col;
    const isSorted = keysSort.col === col;
    th.classList.toggle('sorted', isSorted);
    const iconEl = th.querySelector('.sort-icon');
    if (iconEl) iconEl.textContent = isSorted ? (keysSort.dir === 'asc' ? '▲' : '▼') : '↕';
  });
  const tbody = tbl.querySelector('tbody');
  if (!tbody) return;
  const sorted = sortKeys(currentKeysList, keysSort.col, keysSort.dir);
  let rows = '';
  sorted.forEach(k => {
    rows += `<tr style="${k.revoked ? 'opacity:.5' : ''}">
      <td class="mono">${esc(shortId(k.key_id))}</td>
      <td>${esc(k.label || '—')}</td>
      <td class="mono">${esc(k.prefix || '')}…</td>
      <td>${(k.scopes || []).map(s => `<span class="chip">${esc(s)}</span>`).join('')}</td>
      <td>${fmtDate(k.created_at)}</td>
      <td>${fmtDate(k.expires_at)}</td>
      <td>${k.revoked ? '<span class="badge badge-red">отозван</span>' : '<span class="badge badge-green">активен</span>'}</td>
      <td>${fmtDate(k.last_used_at)}</td>
      <td>${k.rate_limit_per_minute || '—'}</td>
      <td>
        ${!k.revoked ? `<div class="btn-group">
          <button class="btn btn-sm key-rotate" data-id="${esc(k.key_id)}" title="Ротация">🔄</button>
          <button class="btn btn-sm btn-danger key-revoke" data-id="${esc(k.key_id)}" title="Отозвать">⛔</button>
        </div>` : '—'}
      </td>
    </tr>`;
  });
  tbody.innerHTML = rows;
}

async function renderKeys(container) {
  $('#topbar-actions').innerHTML = '';
  $('#topbar-actions').appendChild(
    h('button', {class: 'btn btn-primary', onClick: showCreateKeyModal}, '+ Создать ключ')
  );

  try {
    const data = await API.get('/admin/keys', {include_revoked: true});
    currentKeysList = data.keys || [];
    container.innerHTML = '';

    if (!currentKeysList.length) {
      container.innerHTML = '<div class="empty-state"><span class="icon">🔑</span><p>Нет API-ключей</p></div>';
      return;
    }

    const keyColumns = [
      { key: 'key_id', label: 'ID' },
      { key: 'label', label: 'Label' },
      { key: 'prefix', label: 'Prefix' },
      { key: 'scopes', label: 'Scopes' },
      { key: 'created_at', label: 'Создан' },
      { key: 'expires_at', label: 'Истекает' },
      { key: 'revoked', label: 'Статус' },
      { key: 'last_used_at', label: 'Использован' },
      { key: 'rate_limit_per_minute', label: 'Rate/min' },
    ];

    const ths = keyColumns.map(c => {
      const isSorted = keysSort.col === c.key;
      const icon = isSorted ? (keysSort.dir === 'asc' ? '▲' : '▼') : '↕';
      return `<th class="sortable ${isSorted ? 'sorted' : ''}" data-col="${c.key}" title="Сортировать по ${c.label}">${c.label}<span class="sort-icon">${icon}</span></th>`;
    }).join('') + '<th></th>';

    const tbl = h('div', {class: 'table-wrap'});
    tbl.innerHTML = `<table><thead><tr>${ths}</tr></thead><tbody></tbody></table>`;
    container.appendChild(tbl);
    updateKeysTable(tbl);

    tbl.addEventListener('click', async e => {
      const th = e.target.closest('th.sortable');
      if (th) {
        const col = th.dataset.col;
        if (keysSort.col === col) {
          keysSort.dir = keysSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          keysSort.col = col;
          keysSort.dir = 'asc';
        }
        updateKeysTable(tbl);
        return;
      }

      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.classList.contains('key-revoke')) {
        if (!confirmAction('Отозвать ключ?')) return;
        try {
          await API.post(`/admin/keys/${btn.dataset.id}/revoke`);
          toast('Ключ отозван', 'success');
          renderKeys(container);
        } catch (err) { toast(err.message, 'error'); }
      } else if (btn.classList.contains('key-rotate')) {
        try {
          const res = await API.post(`/admin/keys/${btn.dataset.id}/rotate`);
          showKeyResult(res);
          renderKeys(container);
        } catch (err) { toast(err.message, 'error'); }
      }
    });
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

function showCreateKeyModal() {
  const form = h('div', null,
    h('div', {class: 'form-group'},
      h('label', null, 'Label'),
      h('input', {class: 'form-control', id: 'key-label', placeholder: 'My API Key'})
    ),
    h('div', {class: 'form-group'},
      h('label', null, 'Scopes'),
      h('div', {class: 'checkbox-group'},
        ...['ollama:read', 'ollama:generate', 'ollama:embed'].map(s =>
          h('label', null,
            h('input', {type: 'checkbox', class: 'key-scope', value: s, ...(s !== 'ollama:embed' ? {checked: ''} : {})}),
            s
          )
        )
      )
    ),
    h('div', {class: 'form-group'},
      h('label', null, 'Rate Limit (req/min)'),
      h('input', {class: 'form-control', id: 'key-rate', type: 'number', placeholder: 'по умолчанию'})
    ),
    h('div', {class: 'form-group'},
      h('label', null, 'TTL (секунды, пусто = бессрочно)'),
      h('input', {class: 'form-control', id: 'key-ttl', type: 'number', placeholder: '86400'})
    ),
    h('div', {class: 'modal-footer'},
      h('button', {class: 'btn', onClick: closeModal}, 'Отмена'),
      h('button', {class: 'btn btn-primary', onClick: submitCreateKey}, 'Создать')
    )
  );
  showModal('Создание API-ключа', form);
}

async function submitCreateKey() {
  const scopes = $$('.key-scope:checked').map(cb => cb.value);
  const body = {
    label: $('#key-label').value.trim(),
    scopes: scopes,
  };
  const rate = parseInt($('#key-rate')?.value);
  if (rate) body.rate_limit_per_minute = rate;
  const ttl = parseInt($('#key-ttl')?.value);
  if (ttl) body.ttl_seconds = ttl;

  try {
    const res = await API.post('/admin/keys', body);
    closeModal();
    showKeyResult(res);
    renderKeys($('#content'));
  } catch (e) { toast(e.message, 'error'); }
}

function showKeyResult(data) {
  const el = h('div', null,
    h('div', {style: {background: 'rgba(239,68,68,.1)', border: '1px solid var(--red)', borderRadius: '8px', padding: '12px', marginBottom: '16px'}},
      h('strong', {style: {color: 'var(--red)'}}, '⚠️ Сохраните ключ сейчас! Повторно он не выдаётся.')
    ),
    h('div', {class: 'form-group'},
      h('label', null, 'API Key'),
      h('input', {class: 'form-control mono', value: data.api_key, readonly: '', id: 'new-key-value',
        style: {fontSize: '13px', background: 'var(--bg)', letterSpacing: '.5px'}})
    ),
    h('div', {class: 'modal-footer'},
      h('button', {class: 'btn', onClick: () => { navigator.clipboard.writeText(data.api_key); toast('Скопировано', 'success'); }}, '📋 Копировать'),
      h('button', {class: 'btn btn-primary', onClick: closeModal}, 'Готово')
    )
  );
  showModal('Новый API-ключ', el);
}

/* ====================================================================== */
/*  Audit Log                                                              */
/* ====================================================================== */
async function renderAudit(container) {
  container.innerHTML = '';

  // Filters
  const toolbar = h('div', {class: 'toolbar'},
    h('input', {class: 'form-control', id: 'audit-event', placeholder: 'Фильтр по event…', style: {width: '200px'}}),
    h('input', {class: 'form-control', id: 'audit-subject', placeholder: 'subject_id…', style: {width: '200px'}}),
    h('select', {class: 'form-control', id: 'audit-limit', style: {width: '100px'}},
      h('option', {value: '50'}, '50'),
      h('option', {value: '100', selected: ''}, '100'),
      h('option', {value: '500'}, '500'),
    ),
    h('button', {class: 'btn btn-primary', onClick: () => loadAudit(container)}, '🔍 Найти')
  );
  container.appendChild(toolbar);

  const wrap = h('div', {id: 'audit-table-wrap'});
  container.appendChild(wrap);
  await loadAudit(container);
}

async function loadAudit(container) {
  const wrap = $('#audit-table-wrap');
  if (!wrap) return;
  wrap.innerHTML = '<div class="loading">Загрузка…</div>';
  try {
    const params = {
      limit: $('#audit-limit')?.value || 100,
    };
    const ev = $('#audit-event')?.value?.trim();
    if (ev) params.event = ev;
    const sub = $('#audit-subject')?.value?.trim();
    if (sub) params.subject_id = sub;

    const data = await API.get('/admin/audit', params);
    const entries = data.entries || [];

    if (!entries.length) {
      wrap.innerHTML = '<div class="empty-state"><span class="icon">📋</span><p>Нет записей</p></div>';
      return;
    }

    let rows = '';
    entries.forEach(e => {
      rows += `<tr>
        <td style="white-space:nowrap">${fmtDate(e.created_at)}</td>
        <td><span class="chip">${esc(e.event)}</span></td>
        <td>${esc(e.actor || '—')}</td>
        <td>${esc(e.subject_type || '—')}</td>
        <td class="mono">${esc(shortId(e.subject_id || ''))}</td>
        <td class="mono" style="font-size:11px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(typeof e.detail === 'object' ? JSON.stringify(e.detail) : String(e.detail || '—'))}</td>
      </tr>`;
    });
    wrap.innerHTML = `<div class="table-wrap"><table><thead><tr>
      <th>Время</th><th>Событие</th><th>Actor</th><th>Тип</th><th>Subject</th><th>Детали</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  } catch (e) {
    wrap.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

let cachedConfigData = null;
let configSearchQuery = '';

async function renderConfig(container) {
  $('#topbar-actions').innerHTML = '';

  const searchInput = h('input', {
    type: 'text',
    id: 'config-search-input',
    placeholder: '🔍 Поиск ключей или значений...',
    style: {
      padding: '6px 12px',
      background: 'var(--bg3)',
      border: '1px solid var(--border)',
      borderRadius: 'var(--radius)',
      color: 'var(--text)',
      width: '260px',
      fontSize: '13px',
      outline: 'none'
    },
    value: configSearchQuery
  });
  searchInput.addEventListener('input', (e) => {
    configSearchQuery = e.target.value;
    const treeEl = document.getElementById('config-tree');
    if (treeEl && cachedConfigData) {
      treeEl.innerHTML = renderJsonTree(cachedConfigData, 0, configSearchQuery);
    }
  });

  const actionsWrap = h('div', {style: {display: 'flex', gap: '8px', alignItems: 'center'}},
    searchInput,
    h('button', {class: 'btn btn-primary', onClick: reloadConfig}, '🔄 Перезагрузить')
  );
  $('#topbar-actions').appendChild(actionsWrap);

  try {
    cachedConfigData = await API.get('/admin/config');
    container.innerHTML = '';
    const pre = h('div', {class: 'card'},
      h('div', {class: 'card-title', style: {marginBottom: '12px'}}, 'Текущая конфигурация (секреты скрыты)'),
      h('div', {class: 'json-tree', id: 'config-tree'})
    );
    container.appendChild(pre);
    $('#config-tree').innerHTML = renderJsonTree(cachedConfigData, 0, configSearchQuery);

    // Toggle collapsed
    $('#config-tree').addEventListener('click', e => {
      const toggle = e.target.closest('.json-toggle');
      if (!toggle) return;
      toggle.classList.toggle('collapsed');
      const content = toggle.nextElementSibling;
      if (content) content.style.display = content.style.display === 'none' ? '' : 'none';
    });
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

async function reloadConfig() {
  try {
    const data = await API.post('/admin/config/reload');
    toast(`Конфигурация перезагружена: ${(data.reloaded || []).join(', ')}`, 'success');
    renderConfig($('#content'));
  } catch (e) { toast(e.message, 'error'); }
}

function renderJsonTree(obj, indent = 0, query = '') {
  const q = (query || '').toLowerCase().trim();

  if (obj === null || obj === undefined) {
    const str = 'null';
    const match = q && str.includes(q);
    return `<span class="json-null ${match ? 'json-match' : ''}">${str}</span>`;
  }
  if (typeof obj === 'boolean') {
    const str = String(obj);
    const match = q && str.includes(q);
    return `<span class="json-bool ${match ? 'json-match' : ''}">${str}</span>`;
  }
  if (typeof obj === 'number') {
    const str = String(obj);
    const match = q && str.includes(q);
    return `<span class="json-number ${match ? 'json-match' : ''}">${str}</span>`;
  }
  if (typeof obj === 'string') {
    const val = esc(obj);
    const match = q && (val.toLowerCase().includes(q) || String(obj).toLowerCase().includes(q));
    return `<span class="json-string ${match ? 'json-match' : ''}">"${val}"</span>`;
  }

  const pad = '  '.repeat(indent);
  const pad1 = '  '.repeat(indent + 1);

  if (Array.isArray(obj)) {
    if (!obj.length) return '[]';
    const items = obj.map(v => `${pad1}${renderJsonTree(v, indent + 1, query)}`).join(',\n');
    return `[<br>${items}<br>${pad}]`;
  }

  const entries = Object.entries(obj);
  if (!entries.length) return '{}';

  const inner = entries.map(([k, v]) => {
    const keyMatch = q && k.toLowerCase().includes(q);
    const keyClass = keyMatch ? 'json-key json-match' : 'json-key';
    const kEsc = `"${esc(k)}"`;
    const formattedKey = `<span class="${keyClass}">${kEsc}</span>`;

    const isComplex = typeof v === 'object' && v !== null;
    if (isComplex) {
      return `${pad1}<span class="json-toggle">${formattedKey}</span>: <span>${renderJsonTree(v, indent + 1, query)}</span>`;
    }
    return `${pad1}${formattedKey}: ${renderJsonTree(v, indent + 1, query)}`;
  }).join(',<br>');

  return `{<br>${inner}<br>${pad}}`;
}
