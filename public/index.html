<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Ollama API Gateway</title>
<meta name="description" content="Managed proxy gateway over an authorized Ollama node pool with consent gating, discovery, and admin dashboard">
<meta property="og:title" content="Free Ollama API Gateway">
<meta property="og:description" content="Managed proxy gateway over an authorized Ollama node pool with consent gating, discovery, and admin dashboard">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --bg2: #1a1d27; --bg3: #242734; --bg4: #2e3140;
  --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --accent: #6366f1; --accent2: #818cf8;
  --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --blue: #3b82f6; --cyan: #06b6d4;
  --border: #2e3140; --radius: 8px; --radius-sm: 4px;
  --sidebar-w: 240px;
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; font-size: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }

/* ===== Login Screen ===== */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; background: var(--bg);
}
.login-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 40px; width: 400px; max-width: 90vw; text-align: center;
}
.login-box h1 { font-size: 24px; margin-bottom: 4px; }
.login-box .subtitle { color: var(--text2); margin-bottom: 28px; font-size: 13px; }
.login-box .logo { font-size: 40px; margin-bottom: 16px; display: block; }
.login-box input {
  width: 100%; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); margin-bottom: 12px; outline: none;
}
.login-box input:focus { border-color: var(--accent); }
.login-box .btn-login {
  width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius); font-weight: 600; font-size: 14px; margin-top: 4px;
}
.login-box .btn-login:hover { background: var(--accent2); }
.login-error { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 20px; }

/* ===== App Layout ===== */
#app { display: none; height: 100vh; }
#app.active { display: flex; }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.sidebar-brand {
  padding: 20px 16px; border-bottom: 1px solid var(--border);
  font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px;
}
.sidebar-brand .icon { font-size: 22px; }
.sidebar-nav { padding: 8px; flex: 1; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--radius); color: var(--text2);
  font-size: 13px; font-weight: 500; margin-bottom: 2px; transition: all .15s;
}
.sidebar-nav a:hover { background: var(--bg3); color: var(--text); text-decoration: none; }
.sidebar-nav a.active { background: var(--accent); color: #fff; }
.sidebar-nav a .icon { width: 20px; text-align: center; font-size: 16px; }
.sidebar-nav .section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text3); padding: 16px 12px 6px; font-weight: 600;
}
.sidebar-footer {
  padding: 12px 16px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text3); display: flex; align-items: center; justify-content: space-between;
}
.sidebar-footer button {
  background: none; border: none; color: var(--text3); font-size: 12px; padding: 4px 8px;
  border-radius: var(--radius-sm);
}
.sidebar-footer button:hover { color: var(--red); background: rgba(239,68,68,.1); }

/* ===== Main Content ===== */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.topbar {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg); position: sticky; top: 0; z-index: 10;
}
.topbar h2 { font-size: 18px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.content { padding: 24px; flex: 1; }

/* ===== Cards & Widgets ===== */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px;
}
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.card-value { font-size: 28px; font-weight: 700; }
.card-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }
.card-icon { font-size: 24px; }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--bg3); }
th { padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; transition: color .15s, background .15s; }
th.sortable:hover { color: var(--accent2); background: rgba(99,102,241,.08); }
th.sorted { color: var(--accent2); }
.sort-icon { display: inline-block; margin-left: 5px; font-size: 10px; opacity: .45; vertical-align: middle; }
th.sorted .sort-icon { opacity: 1; color: var(--accent2); }
td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: rgba(99,102,241,.04); }
.mono { font-family: var(--mono); font-size: 12px; }
.truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Badges ===== */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px;
}
.badge-green { background: rgba(34,197,94,.15); color: var(--green); }
.badge-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
.badge-red { background: rgba(239,68,68,.15); color: var(--red); }
.badge-blue { background: rgba(59,130,246,.15); color: var(--blue); }
.badge-gray { background: rgba(100,116,139,.15); color: var(--text3); }
.badge-cyan { background: rgba(6,182,212,.15); color: var(--cyan); }

/* ===== Buttons ===== */
.btn {
  padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--bg3); color: var(--text); font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
}
.btn:hover { background: var(--bg4); border-color: var(--text3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
.btn-danger { background: rgba(239,68,68,.15); border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn-success { background: rgba(34,197,94,.15); border-color: var(--green); color: var(--green); }
.btn-success:hover { background: var(--green); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { padding: 6px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; }
.btn-group { display: flex; gap: 4px; }

/* ===== Forms & Modals ===== */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
.form-control {
  width: 100%; padding: 8px 12px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); outline: none;
}
.form-control:focus { border-color: var(--accent); }
select.form-control { appearance: auto; }
.checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.checkbox-group label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; font-weight: 400; cursor: pointer; }
.checkbox-group input[type="checkbox"] { accent-color: var(--accent); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
  align-items: center; justify-content: center; z-index: 1000;
}
.modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; width: 520px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
}
.modal h3 { font-size: 17px; margin-bottom: 16px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* ===== Toast ===== */
.toast-container { position: fixed; top: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  min-width: 260px; animation: slideIn .3s ease; box-shadow: 0 4px 16px rgba(0,0,0,.4);
}
.toast-success { background: #166534; color: #bbf7d0; border: 1px solid var(--green); }
.toast-error { background: #7f1d1d; color: #fecaca; border: 1px solid var(--red); }
.toast-info { background: #1e3a5f; color: #bfdbfe; border: 1px solid var(--blue); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ===== JSON Tree ===== */
.json-tree { font-family: var(--mono); font-size: 12px; line-height: 1.7; }
.json-key { color: var(--accent2); }
.json-string { color: var(--green); }
.json-number { color: var(--yellow); }
.json-bool { color: var(--cyan); }
.json-null { color: var(--text3); }
.json-toggle { cursor: pointer; user-select: none; }
.json-toggle::before { content: '▼ '; font-size: 10px; }
.json-toggle.collapsed::before { content: '▶ '; }
.json-match {
  background: rgba(245, 158, 11, 0.25) !important;
  color: #fbbf24 !important;
  padding: 1px 4px;
  border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.4);
}

/* ===== Chip ===== */
.chip {
  display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px;
  background: var(--bg4); color: var(--text2); margin: 1px 2px; font-family: var(--mono);
}

/* ===== Security flags ===== */
.flag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.flag {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
}
.flag-on { background: rgba(34,197,94,.12); color: var(--green); }
.flag-off { background: rgba(239,68,68,.1); color: var(--red); }

/* ===== Misc ===== */
.empty-state { text-align: center; padding: 48px 24px; color: var(--text3); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; display: block; }
.loading { text-align: center; padding: 32px; color: var(--text3); }
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.toolbar .spacer { flex: 1; }
.tag-input { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.detail-grid { display: grid; grid-template-columns: 160px 1fr; gap: 6px 16px; font-size: 13px; }
.detail-grid dt { color: var(--text3); font-weight: 500; }
.detail-grid dd { color: var(--text); word-break: break-all; }

/* ===== Bulk Toolbar ===== */
.bulk-toolbar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg2);
  border: 1px solid var(--accent);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  border-radius: var(--radius);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 1000;
  animation: floatUp .2s ease;
}
@keyframes floatUp {
  from { transform: translate(-50%, 20px); opacity: 0; }
  to { transform: translate(-50%, 0); opacity: 1; }
}

/* ===== Table Grouping Styles ===== */
.group-header-row {
  background: var(--bg3) !important;
  border-top: 2px solid var(--border);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.group-header-row:hover td {
  background: var(--bg4) !important;
}
.group-header-row td {
  padding: 10px 14px !important;
}
.group-header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.group-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.group-toggle-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.06);
  font-size: 11px;
  color: var(--text2);
  transition: transform .15s, color .15s, background .15s;
}
.group-header-row:hover .group-toggle-icon {
  color: var(--accent2);
  background: rgba(99, 102, 241, 0.2);
}
.group-title {
  font-size: 13px;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.group-badge {
  font-size: 11px;
  background: var(--bg4);
  color: var(--text2);
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
}
.group-header-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text3);
}
.group-header-meta strong {
  color: var(--text2);
  font-weight: 600;
}
.group-child-row td {
  background: var(--bg2);
}
.group-child-row:hover td {
  background: rgba(99, 102, 241, 0.05) !important;
}
.group-child-indent {
  display: inline-flex;
  align-items: center;
  margin-right: 6px;
  color: var(--text3);
  font-family: var(--mono);
  font-size: 11px;
}
.segmented-btn {
  padding: 5px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all .15s;
}
.segmented-btn:hover {
  background: var(--bg4);
  color: var(--text);
  border-color: var(--text3);
}
.segmented-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(99, 102, 241, 0.4);
}

/* ===== Help & Documentation Styles ===== */
.help-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px; margin-bottom: 20px;
}
.help-hero {
  background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(6,182,212,0.06));
  border: 1px solid rgba(99,102,241,0.25); border-radius: 12px; padding: 22px 24px; margin-bottom: 22px;
}
.help-tabs-nav {
  display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: var(--radius);
  border: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto;
}
.help-tab-btn {
  padding: 8px 16px; border: none; background: transparent; color: var(--text2);
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.help-tab-btn:hover { color: var(--text); background: var(--bg3); }
.help-tab-btn.active { color: #fff; background: var(--accent); font-weight: 600; }
.code-container {
  background: #0b0d13; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 10px;
}
.code-header {
  display: flex; justify-content: space-between; align-items: center; padding: 8px 14px;
  background: #141721; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text3);
}
.code-body {
  padding: 14px; margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.6;
  color: #e2e8f0; overflow-x: auto; white-space: pre;
}
.endpoint-badge {
  display: inline-block; font-family: var(--mono); font-weight: 700; font-size: 11px;
  padding: 2px 7px; border-radius: 4px;
}
.endpoint-get { background: rgba(34,197,94,.15); color: var(--green); }
.endpoint-post { background: rgba(59,130,246,.15); color: var(--blue); }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .content { padding: 16px; }
}
</style>
</head>
<body>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toasts"></div>

<!-- ===== Login Screen ===== -->
<div id="login-screen">
  <div class="login-box">
    <span class="logo">🦙</span>
    <h1>FOA Gateway</h1>
    <p class="subtitle">Панель администрирования</p>
    <input type="password" id="login-token" placeholder="Admin / Auditor Token (например: foa-admin-secret)" value="foa-admin-secret" autocomplete="off">
    <button class="btn-login" onclick="doLogin()">Войти в панель</button>
    <div style="margin-top: 10px; font-size: 12px; color: var(--text3);">Демо-токен: <span style="color:var(--accent2); font-family:var(--mono);">foa-admin-secret</span></div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ===== App Layout ===== -->
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="icon">🦙</span> FOA Gateway</div>
    <nav class="sidebar-nav">
      <div class="section-label">Обзор</div>
      <a href="#dashboard" data-page="dashboard"><span class="icon">📊</span> Dashboard</a>
      <a href="#monitor" data-page="monitor"><span class="icon">📈</span> Monitor</a>
      <div class="section-label">Управление</div>
      <a href="#nodes" data-page="nodes"><span class="icon">🖥️</span> Узлы</a>
      <a href="#consents" data-page="consents"><span class="icon">✅</span> Согласия</a>
      <a href="#blacklist" data-page="blacklist"><span class="icon">🚫</span> Чёрный список</a>
      <a href="#discovery" data-page="discovery"><span class="icon">🔍</span> Discovery</a>
      <a href="#keys" data-page="keys"><span class="icon">🔑</span> API-ключи</a>
      <div class="section-label">Система</div>
      <a href="#audit" data-page="audit"><span class="icon">📋</span> Аудит</a>
      <a href="#config" data-page="config"><span class="icon">⚙️</span> Конфигурация</a>
      <a href="#help" data-page="help"><span class="icon">❓</span> Помощь</a>
    </nav>
    <div class="sidebar-footer">
      <span id="sidebar-version"></span>
      <button onclick="doLogout()">Выйти</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ===== Modals Container ===== -->
<div id="modals"></div>

<script>
/* ====================================================================== */
/*  API Client                                                             */
/* ====================================================================== */
const API = {
  token: '',
  base: '',

  headers() {
    return { 'Authorization': `Bearer ${this.token}`, 'Content-Type': 'application/json' };
  },

  async get(path, params) {
    const url = new URL(this.base + path, location.origin);
    if (params) Object.entries(params).forEach(([k,v]) => { if (v != null) url.searchParams.set(k, v); });
    const res = await fetch(url, { headers: this.headers() });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async post(path, body) {
    const res = await fetch(this.base + path, { method: 'POST', headers: this.headers(), body: JSON.stringify(body || {}) });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async patch(path, body) {
    const res = await fetch(this.base + path, { method: 'PATCH', headers: this.headers(), body: JSON.stringify(body || {}) });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async del(path) {
    const res = await fetch(this.base + path, { method: 'DELETE', headers: this.headers() });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async put(path, body) {
    const res = await fetch(this.base + path, { method: 'PUT', headers: this.headers(), body: JSON.stringify(body || {}) });
    if (!res.ok) throw await this._err(res);
    return res.json();
  },

  async _err(res) {
    try { const j = await res.json(); return new Error(j.error || j.detail || JSON.stringify(j)); }
    catch { return new Error(`HTTP ${res.status}`); }
  }
};

/* ====================================================================== */
/*  Utils                                                                  */
/* ====================================================================== */
function $(sel, ctx) { return (ctx || document).querySelector(sel); }
function $$(sel, ctx) { return [...(ctx || document).querySelectorAll(sel)]; }
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat(9).forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

function shortId(id) { return id ? (id.length > 12 ? id.slice(0, 10) + '…' : id) : '—'; }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
}
function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }

function exportToCsv(filename, columns, dataRows) {
  if (!dataRows || !dataRows.length) return false;

  const escapeCell = (val) => {
    if (val === null || val === undefined) return '""';
    let str = typeof val === 'object' ? JSON.stringify(val) : String(val);
    str = str.replace(/"/g, '""');
    return `"${str}"`;
  };

  const headerLine = columns.map(c => escapeCell(c.label || c.key)).join(',');
  const rowLines = dataRows.map(row => {
    return columns.map(c => {
      let val = row[c.key];
      if (typeof c.format === 'function') {
        val = c.format(val, row);
      }
      return escapeCell(val);
    }).join(',');
  });

  const csvContent = '\uFEFF' + [headerLine, ...rowLines].join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.setAttribute('download', filename);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

function statusBadge(status) {
  const map = {
    healthy: 'green', verified: 'green', active: 'green',
    degraded: 'yellow', pending: 'yellow', pending_consent: 'yellow',
    consent_challenge_sent: 'yellow', challenge_sent: 'yellow',
    unhealthy: 'red', blacklisted: 'red', revoked: 'red', quarantined: 'red',
    failed: 'red', expired: 'red',
    draining: 'blue', candidate: 'cyan', none: 'gray',
    enrolled: 'blue', rejected: 'red', out_of_scope: 'gray', requires_manual_review: 'yellow',
  };
  const color = map[status] || 'gray';
  return `<span class="badge badge-${color}">${status || 'unknown'}</span>`;
}

function modelChips(models) {
  if (!models || !models.length) return '<span class="chip">—</span>';
  return models.slice(0, 5).map(m => `<span class="chip">${esc(m)}</span>`).join('') +
    (models.length > 5 ? `<span class="chip">+${models.length - 5}</span>` : '');
}

function esc(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

function toast(msg, type = 'info') {
  const el = h('div', {class: `toast toast-${type}`}, msg);
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function showModal(title, contentEl, opts = {}) {
  const overlay = h('div', {class: 'modal-overlay', onClick: e => { if (e.target === overlay) overlay.remove(); }},
    h('div', {class: 'modal'},
      h('h3', null, title),
      contentEl
    )
  );
  $('#modals').appendChild(overlay);
  return overlay;
}

function closeModal() { const m = $('.modal-overlay'); if (m) m.remove(); }

function confirmAction(msg) { return window.confirm(msg); }

async function doLogin() {
  const token = $('#login-token').value.trim();
  if (!token) { $('#login-error').textContent = 'Введите токен'; return; }
  API.token = token;
  try {
    const data = await API.get('/admin/status');
    sessionStorage.setItem('foa_token', token);
    $('#login-screen').style.display = 'none';
    $('#app').classList.add('active');
    $('#sidebar-version').textContent = `v${data.version || '?'}`;
    initRouter();
  } catch (e) {
    $('#login-error').textContent = 'Неверный токен или сервер недоступен';
    API.token = '';
  }
}

function doLogout() {
  sessionStorage.removeItem('foa_token');
  API.token = '';
  if (refreshTimer) clearInterval(refreshTimer);
  $('#app').classList.remove('active');
  $('#login-screen').style.display = 'flex';
  $('#login-token').value = '';
  $('#login-error').textContent = '';
}

// Auto-login
(function() {
  const saved = sessionStorage.getItem('foa_token');
  if (saved) {
    API.token = saved;
    API.get('/admin/status').then(data => {
      $('#login-screen').style.display = 'none';

})();

function formatCountry(code) {
  if (!code) return { flag: '🌐', name: 'Не указана', code: '—', simpleName: 'Не указана' };
  const c = String(code).toUpperCase();
  const item = countryDirectory[c] || { flag: '🌐', name: c, simpleName: c };
  return { flag: item.flag, name: `${item.name} (${c})`, code: c, simpleName: item.name };
}

function pluralizeNodes(count) {
  const mod10 = count % 10;
  const mod100 = count % 100;
  if (mod100 >= 11 && mod100 <= 19) return 'узлов';
  if (mod10 === 1) return 'узел';
  if (mod10 >= 2 && mod10 <= 4) return 'узла';
  return 'узлов';
}

async function bulkAction(action) {
  const ids = Array.from(selectedNodes);
  if (!ids.length) return;
  if (action === 'delete' && !confirmAction(`Удалить выбранные узлы (${ids.length})?`)) return;
  if (action === 'revoke' && !confirmAction(`Отозвать выбранные узлы (${ids.length})?`)) return;

  if (action === 'auto-verify') {
    try {
      const res = await API.post('/admin/nodes/bulk-verify', { node_ids: ids, mode: 'auto', method: 'auto_domain_agreement' });
      toast(`⚡ Авто-верифицировано и включено в маршрутизацию: ${res.count || ids.length}`, 'success');
      selectedNodes.clear();
      updateBulkToolbar();
      if (currentPage === 'nodes') renderNodes($('#content'));
      return;
    } catch (e) { toast(e.message, 'error'); return; }
  }

  if (action === 'manual-verify') {
    try {
      const res = await API.post('/admin/nodes/bulk-verify', { node_ids: ids, mode: 'manual', method: 'manual_admin' });
      toast(`✓ Ручная верификация подтверждена для: ${res.count || ids.length} узлов`, 'success');
      selectedNodes.clear();
      updateBulkToolbar();
      if (currentPage === 'nodes') renderNodes($('#content'));
      return;
    } catch (e) { toast(e.message, 'error'); return; }
  }

  let success = 0;
  let failed = 0;
  for (const id of ids) {
    try {
      if (action === 'delete') {
        await API.del(`/admin/nodes/${id}`);
      } else if (action === 'blacklist') {
        await API.post(`/admin/nodes/${id}/blacklist`, {reason: 'admin_bulk', duration: 'permanent'});
      } else {
        await API.post(`/admin/nodes/${id}/${action}`, {});
      }
      success++;
    } catch (e) {
      failed++;
    }
  }
  toast(`Выполнено: ${success}, ошибок: ${failed}`, failed > 0 ? 'error' : 'success');
  selectedNodes.clear();
  updateBulkToolbar();
  if (currentPage === 'nodes') renderNodes($('#content'));
}

function sortNodes(list, col, dir) {
  return [...list].sort((a, b) => {
    let va = a[col];
    let vb = b[col];
    if (col === 'country') {
      va = a.country || 'ZZ';
      vb = b.country || 'ZZ';
    } else if (col === 'owner_id') {
      va = a.owner_id || '';
      vb = b.owner_id || '';
    } else if (col === 'models') {
      va = (a.models || []).length;
      vb = (b.models || []).length;
    } else if (col === 'active_connections') {
      va = a.active_connections || 0;
      vb = b.active_connections || 0;
    } else if (col === 'latency_ms') {
      va = a.latency_ms != null ? a.latency_ms : -1;
      vb = b.latency_ms != null ? b.latency_ms : -1;
    } else if (col === 'error_rate') {
      va = a.error_rate != null ? a.error_rate : -1;
      vb = b.error_rate != null ? b.error_rate : -1;
    } else if (col === 'routable') {
      va = a.routable ? 1 : 0;
      vb = b.routable ? 1 : 0;
    }
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'number' && typeof vb === 'number') {
      return dir === 'asc' ? va - vb : vb - va;
    }
    const cmp = String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: 'base' });
    return dir === 'asc' ? cmp : -cmp;
  });
}

function getOrderedViewNodes() {
  if (nodesGroupBy === 'none') {
    return sortNodes(currentNodesList, nodesSort.col, nodesSort.dir).map(n => ({
      ...n,
      _group: '—'
    }));
  }

  // Partition nodes into groups matching table view
  const groupsMap = new Map();
  currentNodesList.forEach(n => {
    let gKey = '';
    if (nodesGroupBy === 'country') {
      gKey = (n.country || 'OTHER').toUpperCase();
    } else if (nodesGroupBy === 'owner_id') {
      gKey = n.owner_id || 'unassigned';
    }
    if (!groupsMap.has(gKey)) groupsMap.set(gKey, []);
    groupsMap.get(gKey).push(n);
  });

  const sortedGroupKeys = Array.from(groupsMap.keys()).sort((a, b) => {
    if (nodesGroupBy === 'country') {
      const nameA = formatCountry(a).simpleName || a;
      const nameB = formatCountry(b).simpleName || b;
      return nameA.localeCompare(nameB, 'ru');
    }
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
  });

  const result = [];
  sortedGroupKeys.forEach(gKey => {
    const gNodes = groupsMap.get(gKey);
    const sortedGNodes = sortNodes(gNodes, nodesSort.col, nodesSort.dir);
    const groupName = nodesGroupBy === 'country' ? formatCountry(gKey).name : gKey;
    sortedGNodes.forEach(n => {
      result.push({
        ...n,
        _group: groupName
      });
    });
  });
  return result;
}

function exportNodesCsv(onlySelected = false) {
  let nodesToExport = [];
  if (onlySelected && selectedNodes.size > 0) {
    const subset = currentNodesList.filter(n => selectedNodes.has(n.node_id));

    nodesToExport = getOrderedViewNodes();

  if (!nodesToExport.length) {

  const columns = [

    { label: 'Ошибки (%)', key: 'error_rate', format: v => (v != null ? (Number(v) * 100).toFixed(1) + '%' : '') },
    { label: 'Маршрутизация (Routable)', key: 'routable', format: v => (v ? 'true' : 'false') },
    { label: 'Создан (Created At)', key: 'created_at', format: v => (v ? fmtDate(v) : '') },

  const now = new Date();

  toast(`Экспорт CSV завершён (узлов: ${nodesToExport.length})`, 'success');
}

function renderNodeRow(n, isChild = false, groupKey = '') {

    <td>
      ${isChild ? '<span class="group-child-indent">├─</span>' : ''}
      <a href="#" class="mono node-link" data-id="${esc(n.node_id)}" style="font-weight: 600;">${esc(shortId(n.node_id))}</a>
    </td>
    <td>${esc(n.display_name || '—')}</td>
    <td>
      <span title="${esc(countryInfo.name)}" style="display: inline-flex; align-items: center; gap: 5px;">
        <span>${countryInfo.flag}</span>
        <span class="mono" style="font-size: 11px;">${esc(n.country || '—')}</span>
      </span>
    </td>
    <td>
      <span class="mono truncate" style="max-width: 140px; font-size: 11px; color: var(--accent2);" title="${esc(n.owner_id || '—')}">
        ${esc(n.owner_id || '—')}
      </span>
    </td>
    <td class="mono truncate" title="${esc(n.endpoint || '')}">${esc(n.endpoint || '—')}</td>
    <td>${statusBadge(n.status)}</td>
    <td>${statusBadge(n.consent_status)}</td>
    <td>${modelChips(n.models)}</td>
    <td>${n.active_connections}/${n.max_concurrency}</td>
    <td>${n.latency_ms != null ? n.latency_ms.toFixed(0) : '—'}</td>
    <td>${n.error_rate != null ? fmtPct(n.error_rate) : '—'}</td>
    <td>${n.routable ? '<span class="badge badge-green">✓</span>' : '<span class="badge badge-gray">✗</span>'}</td>
    <td>
      <div class="btn-group">
        <button class="btn btn-sm node-detail" data-id="${esc(n.node_id)}" title="Детали">📋</button>
        <button class="btn btn-sm btn-success node-verify" data-id="${esc(n.node_id)}" title="Verify">✓</button>
        <button class="btn btn-sm node-health" data-id="${esc(n.node_id)}" title="Health Check">🩺</button>
        <button class="btn btn-sm btn-danger node-del" data-id="${esc(n.node_id)}" title="Удалить">🗑</button>
      </div>
    </td>
  </tr>`;
}

function updateNodesTable(tbl) {
  tbl.querySelectorAll('th.sortable').forEach(th => {
    const col = th.dataset.col;
    const isSorted = nodesSort.col === col;
    th.classList.toggle('sorted', isSorted);
    const iconEl = th.querySelector('.sort-icon');
    if (iconEl) iconEl.textContent = isSorted ? (nodesSort.dir === 'asc' ? '▲' : '▼') : '↕';
  });
  const tbody = tbl.querySelector('tbody');
  if (!tbody) return;

  let rows = '';

  if (nodesGroupBy === 'none') {
    const sorted = sortNodes(currentNodesList, nodesSort.col, nodesSort.dir);
    sorted.forEach(n => {
      rows += renderNodeRow(n, false, '');
    });
  } else {
    // Partition nodes into groups
    const groupsMap = new Map();
    currentNodesList.forEach(n => {
      let gKey = '';
      if (nodesGroupBy === 'country') {
        gKey = (n.country || 'OTHER').toUpperCase();
      } else if (nodesGroupBy === 'owner_id') {
        gKey = n.owner_id || 'unassigned';
      }
      if (!groupsMap.has(gKey)) groupsMap.set(gKey, []);
      groupsMap.get(gKey).push(n);
    });

    // Sort group keys
    const sortedGroupKeys = Array.from(groupsMap.keys()).sort((a, b) => {
      if (nodesGroupBy === 'country') {
        const nameA = formatCountry(a).simpleName || a;
        const nameB = formatCountry(b).simpleName || b;
        return nameA.localeCompare(nameB, 'ru');
      }
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    });

    sortedGroupKeys.forEach(gKey => {
      const gNodes = groupsMap.get(gKey);
      const isCollapsed = collapsedGroups.has(gKey);
      const sortedGNodes = sortNodes(gNodes, nodesSort.col, nodesSort.dir);

      const allGChecked = gNodes.length > 0 && gNodes.every(n => selectedNodes.has(n.node_id));
      const someGChecked = !allGChecked && gNodes.some(n => selectedNodes.has(n.node_id));

      let groupTitle = '';
      let groupIcon = '';
      if (nodesGroupBy === 'country') {
        const cInfo = formatCountry(gKey);
        groupIcon = cInfo.flag;
        groupTitle = cInfo.name;
      } else {
        groupIcon = '👤';
        groupTitle = gKey;
      }

      const routableCount = gNodes.filter(n => n.routable).length;
      const healthyCount = gNodes.filter(n => n.status === 'healthy').length;
      const avgLat = gNodes.length ? gNodes.reduce((acc, n) => acc + (n.latency_ms || 0), 0) / gNodes.length : 0;
      const avgErr = gNodes.length ? gNodes.reduce((acc, n) => acc + (n.error_rate || 0), 0) / gNodes.length : 0;

      rows += `<tr class="group-header-row" data-group="${esc(gKey)}">
        <td colspan="14">
          <div class="group-header-content">
            <div class="group-header-left">
              <input type="checkbox" class="group-checkbox" data-group="${esc(gKey)}" title="Выбрать все узлы группы" ${allGChecked ? 'checked' : ''} ${someGChecked ? 'data-indeterminate="true"' : ''}>
              <span class="group-toggle-icon">${isCollapsed ? '▶' : '▼'}</span>
              <span class="group-title">${groupIcon} <strong>${esc(groupTitle)}</strong></span>
              <span class="group-badge">${gNodes.length} ${pluralizeNodes(gNodes.length)}</span>
            </div>
            <div class="group-header-meta">
              <span>Активных: <strong style="color: var(--green);">${routableCount}</strong></span>
              <span aria-hidden="true">·</span>
              <span>Здоровых: <strong style="color: var(--accent2);">${healthyCount}</strong></span>
              <span aria-hidden="true">·</span>
              <span>Ср. задержка: <strong>${avgLat > 0 ? avgLat.toFixed(0) + ' мс' : '—'}</strong></span>
              <span aria-hidden="true">·</span>
              <span>Ошибки: <strong>${(avgErr * 100).toFixed(1)}%</strong></span>
            </div>
          </div>
        </td>
      </tr>`;

      if (!isCollapsed) {
        sortedGNodes.forEach(n => {
          rows += renderNodeRow(n, true, gKey);
        });
      }
    });
  }

  tbody.innerHTML = rows;

  // Set indeterminate state on group checkboxes
  tbody.querySelectorAll('.group-checkbox[data-indeterminate="true"]').forEach(cb => {
    cb.indeterminate = true;
  });

  const allChecked = currentNodesList.length > 0 && currentNodesList.every(n => selectedNodes.has(n.node_id));
  const someChecked = !allChecked && currentNodesList.some(n => selectedNodes.has(n.node_id));
  const selectAllEl = tbl.querySelector('#select-all-nodes');
  if (selectAllEl) {
    selectAllEl.checked = allChecked;
    selectAllEl.indeterminate = someChecked;
  }
  updateBulkToolbar();
}

async function renderNodes(container) {
  // Topbar actions
  $('#topbar-actions').innerHTML = '';
  const actionsWrap = h('div', {style: {display: 'flex', gap: '8px', alignItems: 'center'}},
    h('button', {class: `btn ${nodesViewMode === 'table' ? 'btn-primary' : ''}`, onClick: () => { nodesViewMode = 'table'; renderNodes(container); }}, '📋 Таблица'),
    h('button', {class: `btn ${nodesViewMode === 'map' ? 'btn-primary' : ''}`, onClick: () => { nodesViewMode = 'map'; renderNodes(container); }}, '🗺 Карта'),
    h('button', {class: 'btn', id: 'btn-export-nodes-top', onClick: () => exportNodesCsv(), title: 'Экспорт текущих узлов в формате CSV'}, '📥 Export CSV'),
    h('button', {class: 'btn btn-primary', onClick: () => showRegisterNodeModal()}, '+ Зарегистрировать узел')
  );
  $('#topbar-actions').appendChild(actionsWrap);

  try {
    const data = await API.get('/admin/nodes', {detailed: true});
    currentNodesList = data.nodes || [];
    container.innerHTML = '';

    if (!currentNodesList.length) {
      container.innerHTML = `
        <div class="empty-state">
          <span class="icon">🖥️</span>
          <p>Нет зарегистрированных узлов</p>
          <div style="margin-top: 12px; display: flex; gap: 8px; justify-content: center;">
            <button class="btn btn-primary" onclick="showRegisterNodeModal()">+ Зарегистрировать узел</button>
            <button class="btn" onclick="navigate('discovery')">🔍 Найти в Discovery</button>
          </div>
        </div>`;
      return;
    }

    if (nodesViewMode === 'map') {
      const mapWrap = h('div', {class: 'card', style: {padding: '0', overflow: 'hidden', height: '650px', position: 'relative'}});
      const mapDiv = h('div', {id: 'nodes-map', style: {width: '100%', height: '100%'}});
      mapWrap.appendChild(mapDiv);
      container.appendChild(mapWrap);

      setTimeout(() => {
        if (nodesMapInstance) {
          nodesMapInstance.remove();
          nodesMapInstance = null;
        }
        const map = L.map('nodes-map').setView([25, 10], 2);
        nodesMapInstance = map;
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const countryCoords = {
          US: [37.0902, -95.7129],
          DE: [51.1657, 10.4515],
          JP: [36.2048, 138.2529],
          SG: [1.3521, 103.8198],
          FR: [46.6034, 1.8883],
          NL: [52.1326, 5.2913],
          GB: [55.3781, -3.4360],
          CA: [56.1304, -106.3468],
          AU: [-25.2744, 133.7751],
          BR: [-14.2350, -51.9253],
          OTHER: [20.0, 0.0]
        };

        currentNodesList.forEach((n, idx) => {
          const cc = (n.country || 'US').toUpperCase();
          const base = countryCoords[cc] || countryCoords.OTHER;
          const lat = base[0] + ((idx * 4) % 14 - 7);
          const lng = base[1] + ((idx * 6) % 18 - 9);

          const statusColor = n.status === 'healthy' ? '#22c55e' : (n.status === 'degraded' ? '#f59e0b' : '#ef4444');
          const markerHtml = `<div style="background: ${statusColor}; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.5);"></div>`;
          const customIcon = L.divIcon({ html: markerHtml, className: 'custom-node-marker' });

          const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
          const popupContent = `
            <div style="font-family: var(--font); color: #0f1117; min-width: 220px; padding: 4px;">
              <h4 style="margin-bottom: 6px; font-size: 14px; font-weight: 700;">${esc(n.display_name || n.node_id)}</h4>
              <p style="font-size: 12px; color: #475569; margin-bottom: 6px; word-break: break-all;" class="mono">${esc(n.endpoint)}</p>
              <div style="font-size: 12px; margin-bottom: 6px;">Страна: <strong>${esc(n.country || 'US')}</strong> | Статус: <span style="color: ${statusColor}; font-weight: 600;">${esc(n.status)}</span></div>
              <div style="font-size: 12px; margin-bottom: 8px;">Модели: ${(n.models || []).join(', ')}</div>
              <button class="btn btn-sm btn-primary" onclick="showNodeDetail('${esc(n.node_id)}')">Подробнее</button>
            </div>
          `;
          marker.bindPopup(popupContent);
        });
      }, 100);
      return;
    }

    // Grouping & Filtering Toolbar
    const totalRoutable = currentNodesList.filter(n => n.routable).length;
    const groupsCount = (function() {
      if (nodesGroupBy === 'country') {
        return new Set(currentNodesList.map(n => (n.country || 'OTHER').toUpperCase())).size;
      }
      if (nodesGroupBy === 'owner_id') {
        return new Set(currentNodesList.map(n => n.owner_id || 'unassigned')).size;
      }
      return 0;
    })();

    const toolbar = h('div', {
      style: {
        background: 'var(--bg2)',
        border: '1px solid var(--border)',
        borderRadius: 'var(--radius)',
        padding: '10px 16px',
        marginBottom: '14px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        flexWrap: 'wrap',
        gap: '12px'
      }
    });

    const groupControls = h('div', {style: {display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap'}},
      h('span', {style: {fontSize: '12px', fontWeight: '600', color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: '.5px'}}, 'Группировка:'),
      h('button', {
        class: `segmented-btn ${nodesGroupBy === 'none' ? 'active' : ''}`,
        onClick: () => { nodesGroupBy = 'none'; renderNodes(container); }
      }, 'Без группировки'),
      h('button', {
        class: `segmented-btn ${nodesGroupBy === 'country' ? 'active' : ''}`,
        onClick: () => { nodesGroupBy = 'country'; renderNodes(container); }
      }, '🌍 По странам'),
      h('button', {
        class: `segmented-btn ${nodesGroupBy === 'owner_id' ? 'active' : ''}`,
        onClick: () => { nodesGroupBy = 'owner_id'; renderNodes(container); }
      }, '👤 По Owner ID')
    );

    const statsMeta = h('div', {style: {fontSize: '12px', color: 'var(--text3)', display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap'}},
      h('span', null, 'Всего узлов: ', h('strong', {style: {color: 'var(--text)'}}, String(currentNodesList.length))),
      h('span', {'aria-hidden': 'true'}, '·'),
      h('span', null, 'Маршрутизируемых: ', h('strong', {style: {color: 'var(--green)'}}, String(totalRoutable))),
      nodesGroupBy !== 'none' ? h('span', {'aria-hidden': 'true'}, '·') : null,
      nodesGroupBy !== 'none' ? h('span', {style: {color: 'var(--accent2)'}}, 'Групп: ', h('strong', null, String(groupsCount))) : null,
      h('span', {'aria-hidden': 'true'}, '·'),
      h('button', {
        class: 'btn btn-sm',
        id: 'btn-export-nodes-toolbar',
        onClick: () => exportNodesCsv(),
        title: 'Экспорт текущих узлов в формате CSV'
      }, '📥 Export CSV')
    );

    toolbar.appendChild(groupControls);
    toolbar.appendChild(statsMeta);
    container.appendChild(toolbar);

    const nodeColumns = [
      { key: 'node_id', label: 'ID' },
      { key: 'display_name', label: 'Имя' },
      { key: 'country', label: 'Страна' },
      { key: 'owner_id', label: 'Owner ID' },
      { key: 'endpoint', label: 'Endpoint' },
      { key: 'status', label: 'Статус' },
      { key: 'consent_status', label: 'Согласие' },
      { key: 'models', label: 'Модели' },
      { key: 'active_connections', label: 'Conn' },
      { key: 'latency_ms', label: 'Latency' },
      { key: 'error_rate', label: 'Errors' },
      { key: 'routable', label: 'Route' },
    ];

    const ths = `<th><input type="checkbox" id="select-all-nodes"></th>` + nodeColumns.map(c => {
      const isSorted = nodesSort.col === c.key;
      const icon = isSorted ? (nodesSort.dir === 'asc' ? '▲' : '▼') : '↕';
      return `<th class="sortable ${isSorted ? 'sorted' : ''}" data-col="${c.key}" title="Сортировать по ${c.label}">${c.label}<span class="sort-icon">${icon}</span></th>`;
    }).join('') + '<th>Действия</th>';

    const tbl = h('div', {class: 'table-wrap'});
    tbl.innerHTML = `<table><thead><tr>${ths}</tr></thead><tbody></tbody></table>`;
    container.appendChild(tbl);

    // Event delegation for checkboxes
    tbl.addEventListener('change', e => {
      if (e.target && e.target.id === 'select-all-nodes') {
        const isChecked = e.target.checked;
        if (isChecked) {
          currentNodesList.forEach(n => selectedNodes.add(n.node_id));
        } else {
          selectedNodes.clear();
        }
        updateNodesTable(tbl);
      } else if (e.target && e.target.classList.contains('group-checkbox')) {
        const gKey = e.target.dataset.group;
        const isChecked = e.target.checked;
        currentNodesList.forEach(n => {
          const k = nodesGroupBy === 'country' ? (n.country || 'OTHER').toUpperCase() : (n.owner_id || 'unassigned');
          if (k === gKey) {
            if (isChecked) selectedNodes.add(n.node_id);
            else selectedNodes.delete(n.node_id);
          }
        });
        updateNodesTable(tbl);
      } else if (e.target && e.target.classList.contains('node-checkbox')) {
        const id = e.target.dataset.id;
        if (e.target.checked) {
          selectedNodes.add(id);
        } else {
          selectedNodes.delete(id);
        }
        updateNodesTable(tbl);
      }
    });

    // Event delegation for actions, sorting, and group collapsing
    tbl.addEventListener('click', async e => {
      // Group header collapse/expand (ignore if checkbox clicked)
      const groupHeader = e.target.closest('.group-header-row');
      if (groupHeader && !e.target.closest('.group-checkbox')) {
        const gKey = groupHeader.dataset.group;
        if (collapsedGroups.has(gKey)) {
          collapsedGroups.delete(gKey);
        } else {
          collapsedGroups.add(gKey);
        }
        updateNodesTable(tbl);
        return;
      }

      // Column sorting
      const th = e.target.closest('th.sortable');
      if (th) {
        const col = th.dataset.col;
        if (nodesSort.col === col) {
          nodesSort.dir = nodesSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          nodesSort.col = col;
          nodesSort.dir = 'asc';
        }
        updateNodesTable(tbl);
        return;
      }

      // Actions
      const btn = e.target.closest('button, a');
      if (!btn) return;
      e.preventDefault();
      const id = btn.dataset.id;
      if (!id) return;
      if (btn.classList.contains('node-detail') || btn.classList.contains('node-link')) await showNodeDetail(id);
      else if (btn.classList.contains('node-verify')) await showVerificationModal(id, false);
      else if (btn.classList.contains('node-health')) await nodeAction('health-check', id);
      else if (btn.classList.contains('node-del')) await nodeDelete(id);
    });

    // If grouping active, add Collapse/Expand all buttons to toolbar
    if (nodesGroupBy !== 'none') {
      const toggleAllGroup = h('div', {style: {display: 'inline-flex', gap: '6px', marginLeft: '6px'}},
        h('button', {
          class: 'btn btn-sm',
          title: 'Развернуть все группы',
          onClick: () => {
            collapsedGroups.clear();
            updateNodesTable(tbl);
          }
        }, '⤢ Развернуть все'),
        h('button', {
          class: 'btn btn-sm',
          title: 'Свернуть все группы',
          onClick: () => {
            currentNodesList.forEach(n => {
              const k = nodesGroupBy === 'country' ? (n.country || 'OTHER').toUpperCase() : (n.owner_id || 'unassigned');
              collapsedGroups.add(k);
            });
            updateNodesTable(tbl);
          }
        }, '⤡ Свернуть все')
      );
      groupControls.appendChild(toggleAllGroup);
    }

    updateNodesTable(tbl);

    // Auto-refresh
    refreshTimer = setInterval(() => { if (currentPage === 'nodes') renderNodes(container); }, 20000);

  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

async function showNodeDetail(nodeId) {
  try {
    const data = await API.get(`/admin/nodes/${nodeId}`);
    const el = h('div', null,
      h('div', {class: 'detail-grid'},
        ...Object.entries(data).flatMap(([k, v]) => [
          h('dt', null, k),
          h('dd', {class: typeof v === 'string' ? 'mono' : ''}, typeof v === 'object' ? JSON.stringify(v) : String(v ?? '—'))
        ])
      ),
      h('div', {class: 'modal-footer'},
        h('button', {class: 'btn btn-success', onClick: () => { closeModal(); showVerificationModal(nodeId, false); }}, '✓ Верификация (Auto/Manual)'),
        h('button', {class: 'btn', onClick: () => { closeModal(); nodeAction('health-check', nodeId); }}, '🩺 Health Check'),
        h('button', {class: 'btn btn-danger', onClick: () => { closeModal(); nodeAction('revoke', nodeId); }}, '⛔ Revoke'),
        h('button', {class: 'btn btn-danger', onClick: () => { closeModal(); nodeBlacklist(nodeId); }}, '🚫 Blacklist'),
        h('button', {class: 'btn', onClick: closeModal}, 'Закрыть'),
      )
    );
    showModal(`Узел ${shortId(nodeId)}`, el);

}

async function showVerificationModal(itemOrId, isCandidate = false) {
  let item = null;
  let challengeData = null;

  try {
    if (typeof itemOrId === 'object' && itemOrId !== null) {
      item = itemOrId;
      const chUrl = isCandidate
        ? `/admin/candidates/${item.candidate_id}/challenge`
        : `/admin/nodes/${item.node_id}/challenge`;
      challengeData = await API.get(chUrl).catch(() => null);
    } else {
      const url = isCandidate ? `/admin/candidates/${itemOrId}` : `/admin/nodes/${itemOrId}`;
      item = await API.get(url);
      const chUrl = isCandidate
        ? `/admin/candidates/${itemOrId}/challenge`
        : `/admin/nodes/${itemOrId}/challenge`;
      challengeData = await API.get(chUrl).catch(() => null);
    }
  } catch (err) {
    toast(`Ошибка загрузки данных: ${err.message}`, 'error');
    return;
  }

  const id = isCandidate ? item.candidate_id : item.node_id;
  const endpoint = item.endpoint || `http://${item.ip}:${item.port}`;
  const defaultOwner =
    item.owner_id ||
    (item.dns_names && item.dns_names[0] ? `admin@${item.dns_names[0]}` : `domain-owner@${item.ip || 'foa'}`);
  const modelsStr = Array.isArray(item.models) && item.models.length ? item.models.join(', ') : 'llama3:8b, mistral:7b';
  const challengeToken = challengeData?.challenge_token || `ch_${Math.random().toString(36).substring(2, 14)}`;

  let activeMode = 'auto'; // 'auto' | 'manual'

  const modalEl = h('div', null);

  function renderModalContent() {
    modalEl.innerHTML = '';

    // Agreement Banner
    const banner = h('div', {style: {
      background: 'rgba(34,197,94,.12)',
      border: '1px solid var(--green)',
      borderRadius: '8px',
      padding: '12px 14px',
      marginBottom: '14px',
      fontSize: '13px'
    }},
      h('div', {style: {display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '8px', flexWrap: 'wrap'}},
        h('strong', {style: {color: 'var(--green)', display: 'flex', alignItems: 'center', gap: '6px'}},
          '✓ Согласовано с владельцами доменов'
        ),
        h('span', {class: 'badge badge-green'}, 'Маршрутизация разрешена')
      ),
      h('div', {style: {color: 'var(--text2)', marginTop: '4px', fontSize: '12px'}},
        'Прохождение верификации поддерживается как в ручном, так и в автоматическом режимах (§4.4.4 отменён).'
      )
    );
    modalEl.appendChild(banner);

    // Node / Candidate metadata
    const metaCard = h('div', {style: {
      background: 'var(--bg3)',
      borderRadius: '8px',
      padding: '10px 14px',
      marginBottom: '14px',
      display: 'grid',
      gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))',
      gap: '8px',

    const box = $('#manual-challenge-box');

    if (method === 'manual_admin') {
      box.innerHTML = `
        <div style="color: var(--green); font-weight: 600; margin-bottom: 4px;">✓ Согласовано с владельцем домена</div>

        <div style="font-size: 11px; color: var(--text3);">Challenge Token: <span class="mono">${esc(challengeToken)}</span></div>
      `;
    } else if (method === 'http_well_known') {
      const wellKnownUrl = challengeData?.well_known_url || `${endpoint}/.well-known/free-ollama/v1/consent.json`;
      const jsonBody = JSON.stringify(challengeData?.well_known_json || {
        node_id: id,
        challenge: challengeToken,
        owner_id: defaultOwner

        <div style="font-weight: 600; margin-bottom: 4px;">Разместите файл согласия по адресу:</div>
        <div class="mono" style="word-break: break-all; color: var(--accent2); margin-bottom: 6px;">${esc(wellKnownUrl)}</div>
        <pre style="background: var(--bg); padding: 8px; border-radius: 4px; font-size: 11px; overflow-x: auto;">${esc(jsonBody)}</pre>
        <button class="btn btn-sm" style="margin-top: 6px;" onclick="navigator.clipboard.writeText('${esc(jsonBody.replace(/'/g, "\\'"))}'); toast('JSON скопирован', 'success');">📋 Копировать JSON</button>
      `;
    } else if (method === 'dns_txt') {
      const record = challengeData?.dns_txt_record || `_free-ollama-challenge.${endpoint.replace(/^https?:\/\//, '').split(':')[0]}`;
      const val = challengeData?.dns_txt_value || `gateway=foa;node=${id};challenge=${challengeToken}`;
      box.innerHTML = `
        <div style="font-weight: 600; margin-bottom: 4px;">Добавьте DNS TXT запись:</div>
        <div style="margin-bottom: 4px;">Имя: <span class="mono" style="color: var(--accent2);">${esc(record)}</span></div>
        <div style="margin-bottom: 6px;">Значение: <span class="mono" style="color: var(--text);">${esc(val)}</span></div>
        <button class="btn btn-sm" onclick="navigator.clipboard.writeText('${esc(val.replace(/'/g, "\\'"))}'); toast('TXT запись скопирована', 'success');">📋 Копировать TXT</button>
      `;
    } else {
      box.innerHTML = `
        <div style="font-weight: 600; margin-bottom: 4px;">Подписанный JWT токен владельца:</div>
        <p style="color: var(--text2);">Проверка криптографической подписи Ed25519/RSA от имени владельца домена.</p>
        <div class="mono" style="font-size: 11px; color: var(--text3); margin-top: 4px;">Token: ${esc(challengeToken)}</div>
      `;
    }
  }

  renderModalContent();
  showModal(`Верификация: ${isCandidate ? 'Кандидат' : 'Узел'} ${shortId(id)}`, modalEl);
}

async function submitRegisterNode() {
  const body = {
    endpoint: $('#reg-endpoint').value.trim(),
    display_name: $('#reg-name').value.trim(),
    owner_id: $('#reg-owner').value.trim(),
    country: $('#reg-country') ? $('#reg-country').value : 'US',
    models: $('#reg-models').value.split(',').map(s => s.trim()).filter(Boolean),
    max_concurrency: parseInt($('#reg-concurrency').value) || 2,

  try {
    const data = await API.post('/admin/nodes', body);
    closeModal();
    toast(`Узел ${shortId(data.node_id)} зарегистрирован. ${data.next_step || ''}`, 'success');
    // Show challenge info
    if (data.challenge || data.consent_url) {
      showModal('Следующий шаг', h('div', null,
        h('p', null, data.next_step || ''),
        data.challenge ? h('pre', {style: {background: 'var(--bg3)', padding: '12px', borderRadius: '6px', fontSize: '12px', overflowX: 'auto', marginTop: '8px'}}, JSON.stringify(data.challenge, null, 2)) : null,
        h('div', {class: 'modal-footer'}, h('button', {class: 'btn btn-primary', onClick: closeModal}, 'Понятно'))
      ));
    }
    renderNodes($('#content'));
  } catch (e) { toast(e.message, 'error'); }
}

async function renderConsents(container) {
  try {
    const data = await API.get('/admin/consents');
    const list = data.consents || [];
    container.innerHTML = '';

    if (!list.length) {
      container.innerHTML = '<div class="empty-state"><span class="icon">✅</span><p>Нет записей согласий</p></div>';
      return;
    }

    const tbl = h('div', {class: 'table-wrap'});
    let rows = '';
    list.forEach(c => {
      rows += `<tr>
        <td><a href="#" class="mono consent-link" data-id="${esc(c.consent_id)}">${esc(shortId(c.consent_id))}</a></td>
        <td class="mono">${esc(shortId(c.node_id))}</td>
        <td class="mono">${esc(c.owner_id || '—')}</td>
        <td>${statusBadge(c.status)}</td>
        <td>${esc(c.method || '—')}</td>
        <td>${modelChips(c.allowed_models)}</td>
        <td>${fmtDate(c.issued_at)}</td>
        <td>${fmtDate(c.expires_at)}</td>
      </tr>`;
    });
    tbl.innerHTML = `<table><thead><tr>
      <th>ID</th><th>Node</th><th>Owner</th><th>Статус</th><th>Метод</th><th>Модели</th><th>Выдано</th><th>Истекает</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
    container.appendChild(tbl);

    tbl.addEventListener('click', async e => {
      const link = e.target.closest('.consent-link');
      if (!link) return;
      e.preventDefault();
      await showConsentDetail(link.dataset.id);
    });
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

async function renderBlacklist(container) {
  $('#topbar-actions').innerHTML = '';
  try {
    const data = await API.get('/admin/blacklist', {include_expired: true});
    const list = data.blacklist || [];
    container.innerHTML = '';

    const info = h('div', {class: 'card', style: {marginBottom: '16px', padding: '12px 16px'}},
      h('span', null, `Активных блокировок: `),
      h('strong', {style: {color: 'var(--red)'}}, String(data.active_total || 0))
    );
    container.appendChild(info);

    if (!list.length) {
      container.appendChild(h('div', {class: 'empty-state'}, h('span', {class: 'icon'}, '🚫'), h('p', null, 'Чёрный список пуст')));
      return;
    }

    const tbl = h('div', {class: 'table-wrap'});

    let summary = `Discovery: новых: ${data.created || 0}, дедуплицировано: ${data.deduped || 0}`;

}

let keysSort = { col: 'created_at', dir: 'desc' };
let currentKeysList = [];

function sortKeys(list, col, dir) {
  return [...list].sort((a, b) => {
    let va = a[col];
    let vb = b[col];
    if (col === 'scopes') {
      va = (a.scopes || []).length;
      vb = (b.scopes || []).length;
    } else if (col === 'created_at' || col === 'expires_at' || col === 'last_used_at') {
      va = a[col] ? new Date(a[col]).getTime() : 0;
      vb = b[col] ? new Date(b[col]).getTime() : 0;
    } else if (col === 'revoked') {
      va = a.revoked ? 1 : 0;
      vb = b.revoked ? 1 : 0;
    } else if (col === 'rate_limit_per_minute') {
      va = a.rate_limit_per_minute != null ? a.rate_limit_per_minute : -1;
      vb = b.rate_limit_per_minute != null ? b.rate_limit_per_minute : -1;
    }
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'number' && typeof vb === 'number') {
      return dir === 'asc' ? va - vb : vb - va;
    }
    const cmp = String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: 'base' });
    return dir === 'asc' ? cmp : -cmp;
  });
}

function updateKeysTable(tbl) {
  tbl.querySelectorAll('th.sortable').forEach(th => {
    const col = th.dataset.col;
    const isSorted = keysSort.col === col;
    th.classList.toggle('sorted', isSorted);
    const iconEl = th.querySelector('.sort-icon');
    if (iconEl) iconEl.textContent = isSorted ? (keysSort.dir === 'asc' ? '▲' : '▼') : '↕';
  });
  const tbody = tbl.querySelector('tbody');
  if (!tbody) return;
  const sorted = sortKeys(currentKeysList, keysSort.col, keysSort.dir);
  let rows = '';
  sorted.forEach(k => {
    rows += `<tr style="${k.revoked ? 'opacity:.5' : ''}">
      <td class="mono">${esc(shortId(k.key_id))}</td>
      <td>${esc(k.label || '—')}</td>
      <td class="mono">${esc(k.prefix || '')}…</td>
      <td>${(k.scopes || []).map(s => `<span class="chip">${esc(s)}</span>`).join('')}</td>
      <td>${fmtDate(k.created_at)}</td>
      <td>${fmtDate(k.expires_at)}</td>
      <td>${k.revoked ? '<span class="badge badge-red">отозван</span>' : '<span class="badge badge-green">активен</span>'}</td>
      <td>${fmtDate(k.last_used_at)}</td>
      <td>${k.rate_limit_per_minute || '—'}</td>
      <td>
        ${!k.revoked ? `<div class="btn-group">
          <button class="btn btn-sm key-rotate" data-id="${esc(k.key_id)}" title="Ротация">🔄</button>
          <button class="btn btn-sm btn-danger key-revoke" data-id="${esc(k.key_id)}" title="Отозвать">⛔</button>
        </div>` : '—'}
      </td>
    </tr>`;
  });
  tbody.innerHTML = rows;
}

async function renderKeys(container) {
  $('#topbar-actions').innerHTML = '';
  $('#topbar-actions').appendChild(
    h('button', {class: 'btn btn-primary', onClick: showCreateKeyModal}, '+ Создать ключ')
  );

  try {
    const data = await API.get('/admin/keys', {include_revoked: true});
    currentKeysList = data.keys || [];
    container.innerHTML = '';

    if (!currentKeysList.length) {
      container.innerHTML = '<div class="empty-state"><span class="icon">🔑</span><p>Нет API-ключей</p></div>';
      return;
    }

    const keyColumns = [
      { key: 'key_id', label: 'ID' },
      { key: 'label', label: 'Label' },
      { key: 'prefix', label: 'Prefix' },
      { key: 'scopes', label: 'Scopes' },
      { key: 'created_at', label: 'Создан' },
      { key: 'expires_at', label: 'Истекает' },
      { key: 'revoked', label: 'Статус' },
      { key: 'last_used_at', label: 'Использован' },
      { key: 'rate_limit_per_minute', label: 'Rate/min' },
    ];

    const ths = keyColumns.map(c => {
      const isSorted = keysSort.col === c.key;
      const icon = isSorted ? (keysSort.dir === 'asc' ? '▲' : '▼') : '↕';
      return `<th class="sortable ${isSorted ? 'sorted' : ''}" data-col="${c.key}" title="Сортировать по ${c.label}">${c.label}<span class="sort-icon">${icon}</span></th>`;
    }).join('') + '<th></th>';

    const tbl = h('div', {class: 'table-wrap'});
    tbl.innerHTML = `<table><thead><tr>${ths}</tr></thead><tbody></tbody></table>`;
    container.appendChild(tbl);
    updateKeysTable(tbl);

    tbl.addEventListener('click', async e => {
      const th = e.target.closest('th.sortable');
      if (th) {
        const col = th.dataset.col;
        if (keysSort.col === col) {
          keysSort.dir = keysSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          keysSort.col = col;
          keysSort.dir = 'asc';
        }
        updateKeysTable(tbl);
        return;
      }

      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.classList.contains('key-revoke')) {
        if (!confirmAction('Отозвать ключ?')) return;
        try {
          await API.post(`/admin/keys/${btn.dataset.id}/revoke`);
          toast('Ключ отозван', 'success');
          renderKeys(container);
        } catch (err) { toast(err.message, 'error'); }
      } else if (btn.classList.contains('key-rotate')) {
        try {
          const res = await API.post(`/admin/keys/${btn.dataset.id}/rotate`);
          showKeyResult(res);
          renderKeys(container);
        } catch (err) { toast(err.message, 'error'); }
      }
    });
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

async function submitCreateKey() {
  const scopes = $$('.key-scope:checked').map(cb => cb.value);

    label: $('#key-label').value.trim(),
    scopes: scopes,
  };
  const rate = parseInt($('#key-rate')?.value);
  if (rate) body.rate_limit_per_minute = rate;
  const ttl = parseInt($('#key-ttl')?.value);

  try {
    const res = await API.post('/admin/keys', body);

    showKeyResult(res);
    renderKeys($('#content'));

  }

  const columns = [
    { label: 'Время (UTC)', key: 'created_at' },

    { label: 'Actor', key: 'actor' },
    { label: 'Тип (Subject Type)', key: 'subject_type' },
    { label: 'Subject ID', key: 'subject_id' },
    { label: 'Детали (Detail)', key: 'detail', format: v => (typeof v === 'object' ? JSON.stringify(v) : String(v != null ? v : '')) }
  ];

  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10);
  const filename = `audit_log_export_${dateStr}.csv`;
  exportToCsv(filename, columns, currentAuditEntries);
  toast(`Экспорт CSV завершён (записей: ${currentAuditEntries.length})`, 'success');

async function loadAudit(container) {

  if (!wrap) return;
  wrap.innerHTML = '<div class="loading">Загрузка…</div>';
  try {
    const params = {
      limit: $('#audit-limit')?.value || 100,
    };
    const ev = $('#audit-event')?.value?.trim();
    if (ev) params.event = ev;
    const sub = $('#audit-subject')?.value?.trim();
    if (sub) params.subject_id = sub;

    const data = await API.get('/admin/audit', params);
    currentAuditEntries = data.entries || [];

    if (!currentAuditEntries.length) {
      wrap.innerHTML = '<div class="empty-state"><span class="icon">📋</span><p>Нет записей</p></div>';
      return;
    }

    let rows = '';
    currentAuditEntries.forEach(e => {
      rows += `<tr>
        <td style="white-space:nowrap">${fmtDate(e.created_at)}</td>
        <td><span class="chip">${esc(e.event)}</span></td>
        <td>${esc(e.actor || '—')}</td>
        <td>${esc(e.subject_type || '—')}</td>
        <td class="mono">${esc(shortId(e.subject_id || ''))}</td>
        <td class="mono" style="font-size:11px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(typeof e.detail === 'object' ? JSON.stringify(e.detail) : String(e.detail || '—'))}</td>
      </tr>`;
    });
    wrap.innerHTML = `<div class="table-wrap"><table><thead><tr>
      <th>Время</th><th>Событие</th><th>Actor</th><th>Тип</th><th>Subject</th><th>Детали</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  } catch (e) {
    wrap.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

/* ====================================================================== */
/*  Config                                                                 */
/* ====================================================================== */
let cachedConfigData = null;
let configSearchQuery = '';

async function renderConfig(container) {
  $('#topbar-actions').innerHTML = '';

  const searchInput = h('input', {
    type: 'text',
    id: 'config-search-input',
    placeholder: '🔍 Поиск ключей или значений...',
    style: {
      padding: '6px 12px',
      background: 'var(--bg3)',
      border: '1px solid var(--border)',
      borderRadius: 'var(--radius)',
      color: 'var(--text)',
      width: '260px',
      fontSize: '13px',
      outline: 'none'
    },
    value: configSearchQuery
  });
  searchInput.addEventListener('input', (e) => {
    configSearchQuery = e.target.value;
    const treeEl = document.getElementById('config-tree');
    if (treeEl && cachedConfigData) {
      treeEl.innerHTML = renderJsonTree(cachedConfigData, 0, configSearchQuery);
    }
  });

  const actionsWrap = h('div', {style: {display: 'flex', gap: '8px', alignItems: 'center'}},
    searchInput,
    h('button', {class: 'btn btn-primary', onClick: reloadConfig}, '🔄 Перезагрузить')
  );
  $('#topbar-actions').appendChild(actionsWrap);

  try {
    cachedConfigData = await API.get('/admin/config');
    container.innerHTML = '';
    const pre = h('div', {class: 'card'},
      h('div', {class: 'card-title', style: {marginBottom: '12px'}}, 'Текущая конфигурация (секреты скрыты)'),
      h('div', {class: 'json-tree', id: 'config-tree'})
    );
    container.appendChild(pre);
    $('#config-tree').innerHTML = renderJsonTree(cachedConfigData, 0, configSearchQuery);

    // Toggle collapsed
    $('#config-tree').addEventListener('click', e => {
      const toggle = e.target.closest('.json-toggle');
      if (!toggle) return;
      toggle.classList.toggle('collapsed');
      const content = toggle.nextElementSibling;
      if (content) content.style.display = content.style.display === 'none' ? '' : 'none';
    });
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><p>${esc(e.message)}</p></div>`;
  }
}

async function reloadConfig() {
  try {
    const data = await API.post('/admin/config/reload');
    toast(`Конфигурация перезагружена: ${(data.reloaded || []).join(', ')}`, 'success');
    renderConfig($('#content'));
  } catch (e) { toast(e.message, 'error'); }
}

function renderJsonTree(obj, indent = 0, query = '') {
  const q = (query || '').toLowerCase().trim();

  if (obj === null || obj === undefined) {
    const str = 'null';
    const match = q && str.includes(q);
    return `<span class="json-null ${match ? 'json-match' : ''}">${str}</span>`;
  }
  if (typeof obj === 'boolean') {
    const str = String(obj);
    const match = q && str.includes(q);
    return `<span class="json-bool ${match ? 'json-match' : ''}">${str}</span>`;
  }
  if (typeof obj === 'number') {
    const str = String(obj);
    const match = q && str.includes(q);
    return `<span class="json-number ${match ? 'json-match' : ''}">${str}</span>`;
  }
  if (typeof obj === 'string') {
    const val = esc(obj);
    const match = q && (val.toLowerCase().includes(q) || String(obj).toLowerCase().includes(q));
    return `<span class="json-string ${match ? 'json-match' : ''}">"${val}"</span>`;
  }

  const pad = '  '.repeat(indent);
  const pad1 = '  '.repeat(indent + 1);

  if (Array.isArray(obj)) {
    if (!obj.length) return '[]';
    const items = obj.map(v => `${pad1}${renderJsonTree(v, indent + 1, query)}`).join(',\n');
    return `[<br>${items}<br>${pad}]`;
  }

  const entries = Object.entries(obj);
  if (!entries.length) return '{}';

  const inner = entries.map(([k, v]) => {
    const keyMatch = q && k.toLowerCase().includes(q);
    const keyClass = keyMatch ? 'json-key json-match' : 'json-key';
    const kEsc = `"${esc(k)}"`;
    const formattedKey = `<span class="${keyClass}">${kEsc}</span>`;

    const isComplex = typeof v === 'object' && v !== null;
    if (isComplex) {
      return `${pad1}<span class="json-toggle">${formattedKey}</span>: <span>${renderJsonTree(v, indent + 1, query)}</span>`;
    }
    return `${pad1}${formattedKey}: ${renderJsonTree(v, indent + 1, query)}`;
  }).join(',<br>');

  return `{<br>${inner}<br>${pad}}`;
}
