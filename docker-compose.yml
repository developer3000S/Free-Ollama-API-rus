# Free Ollama API Gateway — Docker Compose Topology
name: free-ollama-api-gateway

x-gateway-common: &gateway-common
  build:
    context: .
    dockerfile: Dockerfile
  image: free-ollama-api-gateway:1.0.0
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &gateway-env
    PORT: "3000"
    NODE_ENV: "production"
    GATEWAY_ID: "foa-gw-main-01"
    FOA_SERVER__HOST: 0.0.0.0
    FOA_SERVER__PORT: "3000"
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    FOA_ADMIN_TOKEN: ${FOA_ADMIN_TOKEN:-foa-admin-secret}
    FOA_AUDITOR_TOKEN: ${FOA_AUDITOR_TOKEN:-foa-auditor-secret}
    FOA_STORAGE__DATABASE_URL: postgresql://foa:${POSTGRES_PASSWORD:-postgres_foa_password}@postgres:5432/foa
    FOA_STORAGE__REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [foa]

services:
  # -- Основные узлы шлюза (Node.js / Express Gateway) -------------------- #
  gateway-a:
    <<: *gateway-common
    container_name: foa-gateway-a
    ports:
      - "3000:3000"
    environment:
      <<: *gateway-env
      GATEWAY_ID: "foa-gw-main-01"

  gateway-b:
    <<: *gateway-common
    container_name: foa-gateway-b
    environment:
      <<: *gateway-env
      GATEWAY_ID: "foa-gw-main-02"

  # -- База данных PostgreSQL --------------------------------------------- #
  postgres:
    image: postgres:16-alpine
    container_name: foa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foa
      POSTGRES_USER: foa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_foa_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foa -d foa || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [foa]

  # -- Кэширование и лимиты Redis ----------------------------------------- #
  redis:
    image: redis:7-alpine
    container_name: foa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [foa]

  # -- Наблюдаемость (Prometheus) ----------------------------------------- #
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: foa-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - metricsdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks: [foa]

  # -- Nginx TLS Ingress -------------------------------------------------- #
  nginx:
    image: nginx:1.27-alpine
    container_name: foa-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    ports:
      - "${FOA_HTTP_PORT:-8080}:80"
      - "${FOA_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      - gateway-a
      - gateway-b
    networks: [foa]

networks:
  foa:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  metricsdata:
